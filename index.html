          --h0:#5fcb8a; --t0:rgba(95,203,138,.15); --h1:#f2905f; --t1:rgba(242,144,95,.15); --h2:#f27db4; --t2:rgba(242,125,180,.15);
          --h3:#a596f5; --t3:rgba(165,150,245,.16); --h4:#e5c351; --t4:rgba(229,195,81,.15); --h5:#b5b5b0; --t5:rgba(181,181,176,.15); }

  .leaflet-control-attribution a { color:inherit; }
  .mk { display:block; width:14px; height:14px; border-radius:50%; background:var(--c); box-shadow:0 0 0 2px var(--bg); transition:transform .25s var(--ease), opacity .25s; }
  .mk.been { background:var(--bg); box-shadow:inset 0 0 0 3px var(--c), 0 0 0 2px var(--bg); }
  .mk.out { opacity:.2; }
  .mk.sel { transform:scale(1.6); }
  .mk.sel::after { content:""; position:absolute; inset:-6px; border-radius:50%; border:1.5px solid var(--c); animation:ping 1.4s ease-out 2; opacity:0; }
  @keyframes ping { from { transform:scale(.6); opacity:1; } to { transform:scale(2.2); opacity:0; } }
  .lb { position:absolute; left:20px; top:-3px; white-space:nowrap; font-size:13px; font-weight:700; letter-spacing:-.01em; color:var(--ink);
        text-shadow:0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 6px var(--bg); pointer-events:none; }
  /* the shelf */
  .card { background:var(--paper); border-radius:28px; padding:24px; display:flex; flex-direction:column; box-shadow:0 18px 40px -22px var(--lift); max-height:100%; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; }
  .card::-webkit-scrollbar { display:none; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .tag { font-size:11px; font-weight:700; letter-spacing:.01em; padding:3px 8px 3px 7px; border-radius:6px; background:var(--tint); color:var(--c); display:inline-flex; align-items:center; gap:5px; }
  .tag::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .facts { font-size:12px; color:var(--soft); font-weight:500; }
  .card h2 { margin-top:16px; font-size:44px; font-weight:700; line-height:.95; letter-spacing:-.045em; cursor:pointer; }
  .card.idle h2 { color:var(--soft); cursor:default; }
  .where { margin-top:8px; color:var(--soft); }
  .photos { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; margin:16px -24px 0; padding:0 24px; scroll-padding:0 24px; scrollbar-width:none; touch-action:pan-x; }
  .photos::-webkit-scrollbar { display:none; }
  .photos img { flex:none; height:150px; width:auto; max-width:240px; min-width:120px; object-fit:cover; border-radius:18px; scroll-snap-align:start; background:var(--faint); animation:rise .4s var(--ease) both; }
  .credit { margin-top:8px; font-size:11px; color:var(--soft); }
  .note { margin-top:16px; line-height:1.4; max-width:36ch; }
  .acts { margin-top:auto; padding-top:40px; display:flex; gap:8px; }
  .act { height:50px; border-radius:25px; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:500; text-decoration:none; flex:1; }
  .act.round { width:36px; height:36px; flex:none; padding:0; border-radius:50%; border-width:1.25px; }
  .act.round svg { width:16px; height:16px; }
  .card { position:relative; }
  .act.corner { position:absolute; top:20px; right:20px; }
  .card:not(.idle) .meta { padding-right:48px; min-height:28px; }
  .act.main { background:var(--ink); color:var(--paper); }
  .act:active { transform:scale(.97); }
  .card.landed > :not(.handle) { animation:rise .4s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }
  .handle, .peek { display:none; }

  /* edit sheet */
  .modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.32); display:flex; align-items:flex-end; justify-content:center; animation:fade .18s; }
  .sheet { width:min(620px, 100%); max-height:92vh; overflow:auto; background:var(--paper); border-radius:32px 32px 0 0; padding:12px 24px calc(24px + env(safe-area-inset-bottom)); animation:up .3s var(--ease); }
  .grab { width:40px; height:4px; border-radius:4px; background:var(--faint); margin:0 auto 18px; }
  .sheet h3 { font-size:12px; font-weight:500; color:var(--soft); margin:22px 0 8px; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .opt { font-size:14px; padding:8px 13px; border:1.5px solid var(--ink); border-radius:18px; }
  .opt.on { background:var(--ink); color:var(--paper); }
  .field { width:100%; background:var(--bg); border:1.5px solid var(--faint); border-radius:12px; padding:12px 14px; outline:none; font-size:16px; }
  .field:focus { border-color:var(--ink); }
  .row { display:flex; gap:6px; margin-top:22px; }
  .danger { color:#d0453c; border-color:#d0453c !important; }

  .toast { position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top)); z-index:30; transform:translate(-50%, -14px); background:var(--ink); color:var(--bg);
           padding:12px 18px; border-radius:24px; font-size:14px; display:flex; gap:16px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; width:max-content; max-width:calc(100vw - 32px); }
  .toast.show { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .toast button { text-decoration:underline; text-underline-offset:3px; font-weight:500; }
  @keyframes up { from { transform:translateY(100%); } }
  @keyframes fade { from { opacity:0; } }

  @media (max-width:820px) {
    body { padding:calc(16px + env(safe-area-inset-top)) 16px 0; }
    .word { font-size:72px; }
    .wx svg { width:44px; height:44px; } .wx .deg { font-size:26px; } .wx { height:44px; }
    .ask { font-size:22px; }
    /* the shelf floats over the page, so the radar never changes size */
    .stage { grid-template-columns:minmax(0, 1fr); margin-top:20px; align-items:stretch; }
    .well { gap:16px; }
    .map { margin:0 -16px; width:auto; border-radius:24px 24px 0 0; }
    .card { position:fixed; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); z-index:10; max-height:min(80dvh, 660px);
            padding:0 20px 20px; border-radius:32px; box-shadow:0 -8px 40px -16px var(--lift), 0 0 0 1px var(--faint); touch-action:pan-y; }
    .card.drag { transition:none !important; }
    .card.snap { transition:transform .32s var(--ease); }
    .handle { display:block; position:sticky; top:0; z-index:1; width:calc(100% + 40px); height:24px; margin:0 -20px 8px; background:var(--paper); cursor:grab; }
    .handle::before { content:""; position:absolute; left:50%; top:10px; width:40px; height:4px; margin-left:-20px; border-radius:2px; background:var(--faint); }
    .card.shut { padding-bottom:16px; }
    .card.shut > :not(.handle):not(.peek) { display:none; }
    .card.shut .peek { display:flex; align-items:center; gap:16px; margin-top:-4px; }
    .peek .pn { flex:1; font-size:20px; font-weight:700; letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card.idle .peek .pn { color:var(--soft); font-weight:500; }
    .card h2 { font-size:34px; margin-top:16px; }
    .act.corner { top:32px; right:20px; }
    .card.shut .act.corner { display:none; }
    .photos { margin:16px -20px 0; padding:0 20px; scroll-padding:0 20px; }
    .photos img { height:132px; }
    .acts { padding-top:32px; }
  }
  @media (max-width:820px) and (max-height:700px) { .word { font-size:56px; } .ask { font-size:19px; } .stage { margin-top:8px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

<body>
  <header class="mast">
    <h1 class="word">T-Out</h1>
    <div class="wx" id="wx" role="img" hidden></div>
  </header>

  <main class="stage">
    <div class="well" id="well">
      <p class="ask" id="ask" aria-live="polite"></p>
      <div class="map" id="map" aria-label="Map of places to go"></div>
    </div>
    <article class="card idle" id="card" aria-label="Today's pick"></article>
  </main>

  <div class="modal" id="edit" hidden>
    <div class="sheet"><div class="grab"></div>
      <input class="field" id="eName" style="font-size:24px;font-weight:700;letter-spacing:-.02em" aria-label="Name">
      <input class="field" id="eArea" placeholder="Area, e.g. Dundonald" style="margin-top:6px" aria-label="Area">
      <h3>Inside or out</h3><div class="opts" data-e="where"></div>
      <h3>Cost</h3><div class="opts" data-e="cost"></div>
      <h3>Travel from home</h3><div class="opts" data-e="mins"></div>
      <h3>Mood</h3><div class="opts" data-e="energy"></div>
      <h3>Kind</h3><div class="opts" data-e="kind"></div>
      <h3>Note</h3><textarea class="field" id="eNote" style="min-height:70px" placeholder="Toddler mornings, bring wellies…"></textarea>
      <h3 id="eBeenH"></h3>
      <div class="row"><button class="act" id="eBeen">Been today</button><button class="act danger" id="eDel">Remove</button></div>
      <div class="row"><button class="act main" data-close>Done</button></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
{
  const $ = id => document.getElementById(id);
  const LS = 't-out';
  const NS = 'http://www.w3.org/2000/svg';

  const KINDS = { park:'Park & playground', woods:'Woods & trails', beach:'Beach', animals:'Animals', play:'Soft play', museum:'Museum', space:'Space', group:'Groups & classes', market:'Market', other:'Other' };
  const WHERE = { in:'Inside', out:'Outside', both:'In & out' };
  const COST = ['Free', '£', '££'];
  const MINS = [10, 20, 30, 45, 60, 90];
  const ENERGY = { run:'Run it off', calm:'Calm', mix:'Bit of both' };
  const SECTORS = [['Outdoors', ['park', 'woods', 'beach']], ['Animals', ['animals']], ['Play', ['play']], ['Museums', ['museum', 'space']], ['Groups', ['group', 'market']], ['Other', ['other']]];
  const sectorOf = k => Math.max(0, SECTORS.findIndex(s => s[1].includes(k)));
  const ink = p => `var(--h${sectorOf(p.kind)})`, tint = p => `var(--t${sectorOf(p.kind)})`;

  const IDEAS = [
    ['victoria', 'Victoria Park', 'East Belfast', 'park', 'out', 0, 10, 'run', 'Lake full of swans, geese and ducks, plus a big playpark.'],
    ['waterworks', 'Waterworks', 'Antrim Road', 'park', 'out', 0, 10, 'run', 'Ponds for duck spotting and two playgrounds.'],
    ['botanic', 'Botanic Gardens', 'South Belfast', 'park', 'both', 0, 5, 'mix', 'Palm House and Tropical Ravine when it rains. Free council playgroup for under-5s on Thursday afternoons in the bowling pavilion.'],
    ['ormeau', 'Ormeau Park', 'Ormeau Road', 'park', 'out', 0, 5, 'run', 'Refurbished lower playground and eco trails.'],
    ['momowlam', 'Mo Mowlam Play Park', 'Stormont', 'park', 'out', 0, 15, 'run', 'Toddler area, sensory zone and inclusive kit. Free.'],
    ['dixon', 'Sir Thomas & Lady Dixon Park', 'Malone', 'park', 'out', 0, 15, 'run', 'Meadows to run in and a playground.'],
    ['cavehill', 'Cave Hill Country Park', 'North Belfast', 'park', 'out', 0, 15, 'run', 'Adventurous playground by the castle, woodland walks.'],
    ['gruffalo', 'Gruffalo Trail, Colin Glen', 'West Belfast', 'woods', 'out', 0, 20, 'run', 'Ireland’s official Gruffalo Trail. Short, buggy-able, characters to find.'],
    ['minnowburn', 'Minnowburn', 'Shaw’s Bridge', 'woods', 'out', 0, 15, 'mix', 'National Trust riverside and woods. Puddles guaranteed.'],
    ['crawfordsburn', 'Crawfordsburn Country Park', 'Helen’s Bay', 'beach', 'out', 0, 25, 'run', 'Sandy beach, a waterfall walk and a café.'],
    ['ulstermuseum', 'Ulster Museum', 'Botanic', 'museum', 'in', 0, 5, 'calm', 'Free. Discovery zones and a dinosaur or two.'],
    ['folkmuseum', 'Ulster Folk & Transport Museum', 'Cultra', 'museum', 'both', 2, 20, 'mix', 'Trains, buses and an old village to wander.'],
    ['w5', 'W5', 'Odyssey', 'museum', 'in', 2, 10, 'run', 'Science centre with a storybook under-8s area. Ticket lasts all day.'],
    ['rhyme', 'Rhythm & Rhyme', 'Any Libraries NI branch', 'group', 'in', 0, 10, 'calm', 'Free songs and stories for 0–4s, about 30 minutes. Book ahead. Central Library is Wednesdays at 11.'],
    ['market', 'St George’s Market', 'City centre', 'market', 'in', 0, 5, 'calm', 'Weekend market with live music and plenty to look at.'],
    ['roar', 'Roar and Explore', 'Belfast', 'play', 'in', 1, 10, 'run', 'Animal-themed soft play with its own under-3s area. Cheaper toddler mornings on weekdays.'],
    ['grove', 'Grove Wellbeing Centre soft play', 'York Road', 'play', 'in', 1, 10, 'run', 'Safari soft play, about £4. Free Rhythm & Rhyme on Fridays too.'],
    ['funtastic', 'Funtastic', 'Carryduff', 'play', 'in', 1, 20, 'run', 'Soft play with a toddler area. Cheaper toddler mornings.'],
    ['airtastic', 'Airtastic soft play', 'Newtownabbey', 'play', 'in', 1, 20, 'run', 'Weekday toddler mornings with juice and biscuits. Walk in, no booking.'],
    ['zoo', 'Belfast Zoo', 'Cave Hill', 'animals', 'out', 2, 15, 'mix', 'Hilly, so take the buggy and go early.'],
    ['streamvale', 'Streamvale Open Farm', 'Dundonald', 'animals', 'both', 1, 20, 'mix', 'Bottle-feed lambs, tractor rides, indoor play. Toddler tickets are cheap. Open spring to autumn, so check.'],
    ['laganvale', 'Laganvale Farm', 'Lisburn', 'animals', 'both', 1, 20, 'mix', 'Farm and soft play. In term time the outdoor bit only opens on Saturdays.'],
    ['stjames', 'St James Community Farm', 'West Belfast', 'animals', 'out', 1, 10, 'calm', 'Small city farm with about 50 animals. Check opening times.'],
    ['exploris', 'Exploris Aquarium', 'Portaferry', 'animals', 'in', 2, 60, 'calm', 'Fish, rays and seal rescue. Good for a whole day out.'],
    ['mountpanther', 'Mountpanther Farm Park', 'Clough, near Newcastle', 'animals', 'out', 1, 45, 'run', 'Bouncy pillow, sandpit, ride-on tractors and a small play village.'],
    ['armagh', 'Armagh Planetarium', 'Armagh', 'space', 'in', 1, 60, 'calm', 'Under-3s go free. Pick the pre-school dome show; some shows are for over-6s or over-8s. Book ahead.'],
  ];

  const blankF = () => ({ wx:'any', energy:'any', cost:'any', near:0, pool:'any', sector:-1 });
  const blank = () => ({ v:3, places:[], last:[], f:blankF(), seeded:[] });
  let state;
  try { state = JSON.parse(localStorage.getItem(LS)) || blank(); } catch (e) { state = blank(); }
  state = Object.assign(blank(), state); state.f = Object.assign(blankF(), state.f, { wx:'any' });   // weather comes fresh from the forecast
  IDEAS.forEach(([id, name, area, kind, where, cost, mins, energy, note]) => {
    if (state.seeded.includes(id)) return;
    state.seeded.push(id);
    state.places.push({ id, name, area, kind, where, cost, mins, energy, note, mine:false, been:[] });
  });
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };
  save();

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const q = p => encodeURIComponent(p.name + ' ' + (p.area || '') + ' Northern Ireland');
  const dirUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${q(p)}`;
  const minsLabel = m => m >= 90 ? '90+ min' : m + ' min';
  const today = () => new Date().toISOString().slice(0, 10);
  const ago = d => { const n = Math.round((Date.now() - new Date(d)) / 864e5); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n < 14 ? n + ' days ago' : n < 60 ? Math.round(n / 7) + ' weeks ago' : Math.round(n / 30) + ' months ago'; };
  const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };
  const phone = () => matchMedia('(max-width:820px)').matches;

  // ---------- the sentence ----------
  const ASK = {
    wx:     [['any', 'Any weather'], ['rain', 'It’s raining'], ['dry', 'It’s dry']],
    energy: [['any', 'any mood'], ['run', 'run him ragged'], ['calm', 'keep it calm']],
    cost:   [['any', 'any price'], ['free', 'free'], ['cheap', 'cheap']],
    near:   [[0, 'any distance'], [15, 'under 15 min'], [30, 'under 30 min'], [60, 'under an hour']],
    pool:   [['any', 'anywhere'], ['new', 'somewhere new'], ['mine', 'off our list']],
  };
  function renderAsk() {
    const b = (k, cap) => { const o = ASK[k].find(x => x[0] === state.f[k]) || ASK[k][0], t = cap ? o[1][0].toUpperCase() + o[1].slice(1) : o[1];
      return `<button data-k="${k}" class="${o[0] === ASK[k][0][0] ? 'any' : 'set'}" aria-label="${k}: ${o[1]}. Tap to change">${t}</button>`; };
    $('ask').innerHTML = `<span>${b('energy', true)},</span> <span>${b('cost')},</span> <span>${b('near')},</span> <span>${b('pool')}.</span>`;
  }
  $('ask').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k, o = ASK[k], i = o.findIndex(x => x[0] === state.f[k]);
    state.f[k] = o[(i + 1) % o.length][0]; save(); refresh();
  });
  function fits(p) {
    const f = state.f;
    if (f.wx === 'rain' && p.where === 'out') return false;
    if (f.wx === 'dry' && p.where === 'in') return false;
    if (f.cost === 'free' && p.cost > 0) return false;
    if (f.cost === 'cheap' && p.cost > 1) return false;
    if (+f.near && p.mins > +f.near) return false;
    if (f.energy !== 'any' && p.energy !== f.energy && p.energy !== 'mix') return false;
    if (f.pool === 'new' && p.been.length) return false;
    if (f.pool === 'mine' && !p.mine) return false;
    if (f.sector >= 0 && sectorOf(p.kind) !== f.sector) return false;
    return true;
  }

  // ---------- map ----------
  // where each idea is (roughly, to the venue)
  const AT = {
    victoria:[54.6097,-5.8936], waterworks:[54.6215,-5.9395], botanic:[54.5822,-5.9330], ormeau:[54.5839,-5.9137], momowlam:[54.6044,-5.8360],
    dixon:[54.5480,-5.9950], cavehill:[54.6420,-5.9420], gruffalo:[54.5685,-6.0170], minnowburn:[54.5490,-5.9550], crawfordsburn:[54.6640,-5.7270],
    ulstermuseum:[54.5823,-5.9351], folkmuseum:[54.6440,-5.8170], w5:[54.6040,-5.9150], rhyme:[54.6010,-5.9310], market:[54.5960,-5.9220],
    roar:[54.5530,-6.0140], grove:[54.6200,-5.9230], funtastic:[54.5130,-5.8750], airtastic:[54.6870,-5.9560], zoo:[54.6570,-5.9420],
    streamvale:[54.5840,-5.8000], laganvale:[54.5390,-6.0120], stjames:[54.5845,-5.9640], exploris:[54.3810,-5.5480], mountpanther:[54.2950,-5.8270],
    armagh:[54.3530,-6.6500],
  };
  state.places.forEach(p => { if (!p.at && AT[p.id]) p.at = AT[p.id]; if (p.id === 'roar' && p.area === 'Belfast') p.area = 'Dunmurry'; });
  save();
  let map, tiles, layer;
  const marks = new Map();
  const dark = matchMedia('(prefers-color-scheme: dark)');
  function setTiles() {
    if (tiles) tiles.remove();
    tiles = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark.matches ? 'dark_all' : 'light_all'}/{z}/{x}/{y}{r}.png`, {
      maxZoom:19, subdomains:'abcd', attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>' }).addTo(map);
  }
  function buildMap() {
    if (!window.L) { $('map').innerHTML = '<p class="where" style="padding:24px">The map couldn’t load.</p>'; return; }
    map = L.map('map', { zoomControl:false, attributionControl:true, zoomSnap:.25 });
    map.attributionControl.setPosition('topright').setPrefix(false);
    setTiles(); dark.addEventListener?.('change', setTiles);
    layer = L.layerGroup().addTo(map);
    const near = state.places.filter(p => p.at && p.mins <= 30).map(p => p.at);
    map.fitBounds(near.length ? near : [[54.55, -6.02], [54.66, -5.83]], { padding:[24, 24] });
  }
  function renderMap() {
    if (!map) return;
    layer.clearLayers(); marks.clear();
    [...state.places].sort((a, b) => fits(a) - fits(b) || (a === current) - (b === current)).forEach(p => {
      if (!p.at) return;
      const sel = p === current, cls = `mk${p.been.length ? ' been' : ''}${fits(p) ? '' : ' out'}${sel ? ' sel' : ''}`;
      const icon = L.divIcon({ className:'', iconSize:[14, 14], iconAnchor:[7, 7],
        html:`<span class="${cls}" style="--c:${ink(p)}"></span>${sel ? `<span class="lb">${esc(p.name)}</span>` : ''}` });
      const m = L.marker(p.at, { icon, keyboard:true, title:p.name, zIndexOffset:sel ? 1000 : fits(p) ? 100 : 0 }).addTo(layer);
      m.on('click', () => { select(p, true); centreOn(p); });
      marks.set(p.id, m);
    });
  }
  // bring a place into view, nudged up so it isn't hidden under the shelf on a phone
  function centreOn(p) {
    if (!map || !p.at) return;
    const z = Math.max(map.getZoom(), p.mins > 40 ? 10 : 13);
    const pt = map.project(p.at, z).add([0, phone() && !shut ? $('card').offsetHeight / 2 : 0]);
    map.flyTo(map.unproject(pt, z), z, { duration:.8 });
  }

  // ---------- photos (Wikipedia; only where the host allows it) ----------
  const PHOTO = {};
  try { Object.assign(PHOTO, JSON.parse(localStorage.getItem(LS + '-img') || '{}')); } catch (e) {}
  const STOP = new Set(['park', 'the', 'and', 'belfast', 'country', 'centre', 'play', 'soft', 'farm', 'open', 'trail']);
  async function photosFor(p) {
    if (PHOTO[p.id]) return PHOTO[p.id];
    const words = p.name.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 3 && !STOP.has(w));
    const s = await (await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${q(p)}&srlimit=4&format=json&origin=*`)).json();
    const hit = (s.query?.search || []).find(r => words.some(w => r.title.toLowerCase().includes(w)));
    let out = { page:null, imgs:[] };
    if (hit) {
      const t = hit.title.replace(/ /g, '_');
      const m = await (await fetch(`https://en.wikipedia.org/api/rest_v1/page/media-list/${encodeURIComponent(t)}`)).json();
      const imgs = (m.items || []).filter(i => i.type === 'image' && i.srcset && !/\.svg|logo|map|flag|icon|coat|locator|crest|sign/i.test(i.title))
        .map(i => 'https:' + (i.srcset.find(x => x.scale === '1.5x') || i.srcset[0]).src).slice(0, 6);
      out = { page:`https://en.wikipedia.org/wiki/${encodeURIComponent(t)}`, imgs };
    }
    PHOTO[p.id] = out;
    try { localStorage.setItem(LS + '-img', JSON.stringify(PHOTO)); } catch (e) {}
    return out;
  }
  function loadPhotos(p) {
    photosFor(p).then(o => {
      if (current !== p || !o.imgs.length) return;
      const box = $('card').querySelector('.photos'); if (!box) return;
      box.innerHTML = o.imgs.map(u => `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`).join('');
      box.hidden = false;
      const c = $('card').querySelector('.credit'); c.innerHTML = `Photos: <a href="${esc(o.page)}" target="_blank" rel="noopener">Wikipedia</a>`; c.hidden = false;
    }).catch(() => {});
  }

  // ---------- the shelf ----------
  let current = null, shut = phone();
  const REFRESH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5M20 4v4.5h-4.5"/></svg>';
  const HANDLE = '<div class="handle" aria-hidden="true"></div>';
  function renderCard(animate) {
    const c = $('card'), p = current, n = state.places.filter(fits).length;
    c.classList.toggle('idle', !p); c.classList.remove('landed');
    const peek = `<div class="peek"><span class="pn">${p ? esc(p.name) : n ? 'Flick up for a day out' : 'Nothing fits'}</span><button class="act round" data-a="pick" aria-label="${p ? 'Another' : 'Pick'}" ${n ? '' : 'disabled'}>${REFRESH}</button></div>`;
    if (!p) {
      c.innerHTML = HANDLE + peek + `<h2>${n ? 'Where to, Theo?' : 'Nothing fits.'}</h2>
        <p class="where">${n ? 'Further out means a longer drive.' : 'Tap an underlined word to loosen it.'}</p>
        <div class="acts"><button class="act main" data-a="pick" ${n ? '' : 'disabled'}>${REFRESH}Pick for me</button></div>`;
    } else {
      c.innerHTML = HANDLE + peek + `<div class="meta"><span class="tag" style="--c:${ink(p)};--tint:${tint(p)}">${KINDS[p.kind]}</span><span class="facts">${WHERE[p.where]} · ${COST[p.cost]} · ${minsLabel(p.mins)}</span></div>
        <h2 data-a="edit" title="Edit">${esc(p.name)}</h2>
        <p class="where">${esc([p.area, p.been.length ? 'last went ' + ago(p.been[p.been.length - 1]) : 'never been'].filter(Boolean).join(' · '))}</p>
        <div class="photos" hidden></div><p class="credit" hidden></p>
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
        <button class="act round corner" data-a="pick" aria-label="Another">${REFRESH}</button>
        <div class="acts">
          <a class="act main" href="${esc(dirUrl(p))}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.2L20 4l-7.2 16.5-2.1-7.2z"/></svg>Directions</a>
        </div>`;
      loadPhotos(p);
    }
    c.classList.toggle('shut', shut);
    if (animate) { void c.offsetWidth; c.classList.add('landed'); }
  }
  function setShelf(close) {
    shut = close && phone(); $('card').classList.toggle('shut', shut);
    if (!shut) $('card').scrollTop = 0;
  }
  $('card').addEventListener('click', e => {
    if (cardDragged) return;
    const a = e.target.closest('[data-a]');
    if (!a) return;
    if (a.dataset.a === 'pick') { if (shut) setShelf(false); pick(); }
    if (a.dataset.a === 'edit') openEdit(current);
  });
  // flick the shelf: up opens it (and picks somewhere if nothing's chosen yet), down tucks it away
  let y0 = null, dy = 0, t0 = 0, cardDragged = false;
  $('card').addEventListener('pointerdown', e => {
    if (!phone() || e.button > 0 || e.target.closest('.photos, a, button:not(.handle)')) return;
    if (!shut && $('card').scrollTop > 0 && !e.target.closest('.handle')) return;   // let the open shelf scroll
    y0 = e.clientY; dy = 0; t0 = Date.now(); cardDragged = false;
  });
  addEventListener('pointermove', e => {
    if (y0 === null) return;
    dy = e.clientY - y0;
    if (!cardDragged && Math.abs(dy) < 6) return;
    cardDragged = true; $('card').classList.add('drag');
    $('card').style.transform = `translateY(${shut ? Math.min(0, dy) * .35 : Math.max(0, dy)}px)`;
  });
  addEventListener('pointerup', () => {
    if (y0 === null) return;
    const c = $('card'), v = dy / Math.max(1, Date.now() - t0); y0 = null;
    c.classList.remove('drag'); c.classList.add('snap'); c.style.transform = '';
    setTimeout(() => c.classList.remove('snap'), 340);
    if (cardDragged) {
      if (!shut && (dy > 60 || v > .5)) setShelf(true);
      else if (shut && (dy < -24 || v < -.3)) { setShelf(false); if (!current) pick(); }
    } else if (shut) setShelf(false);
    setTimeout(() => { cardDragged = false; }, 0);
  });
  addEventListener('resize', () => { if (!phone() && shut) setShelf(false); });

  function select(p, animate) {
    current = p; if (p && animate) shut = false;
    renderMap(); renderCard(animate);
  }

  // ---------- pick ----------
  function weight(p) {
    let w = p.been.length ? 1 : 2.5;
    if (p.mine) w *= 1.6;
    const i = state.last.indexOf(p.id); if (i > -1) w *= 0.05 + i * 0.12;
    if (p.been.length && (Date.now() - new Date(p.been[p.been.length - 1])) < 7 * 864e5) w *= 0.2;
    return w;
  }
  let busy = false;
  function pick() {
    if (busy) return;
    const c = state.places.filter(fits).filter(p => p !== current);
    if (!c.length) { toast(current ? 'That’s the only one that fits' : 'Nothing fits. Tap an underlined word'); return; }
    let r = Math.random() * c.reduce((s, p) => s + weight(p), 0), win = c[c.length - 1];
    for (const p of c) { r -= weight(p); if (r <= 0) { win = p; break; } }
    state.last = [win.id, ...state.last.filter(x => x !== win.id)].slice(0, 6); save();
    select(win, true); requestAnimationFrame(() => centreOn(win));
  }

  // ---------- edit ----------
  const open = id => { $(id).hidden = false; };
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) { m.hidden = true; commitEdit(); refresh(); } }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('edit').hidden) { $('edit').hidden = true; commitEdit(); refresh(); } });
  function opts(box, map, isOn, onPick) {
    box.innerHTML = Object.entries(map).map(([k, l]) => `<button class="opt ${isOn(k) ? 'on' : ''}" data-k="${k}">${l}</button>`).join('');
    box.onclick = e => { const b = e.target.closest('.opt'); if (b) { onPick(b.dataset.k); save(); } };
  }
  let editing = null;
  function renderEdit() {
    const p = editing, qq = s => document.querySelector(`[data-e="${s}"]`);
    opts(qq('where'), WHERE, k => p.where === k, k => { p.where = k; renderEdit(); });
    opts(qq('cost'), Object.fromEntries(COST.map((c, i) => [i, c])), k => p.cost === +k, k => { p.cost = +k; renderEdit(); });
    opts(qq('mins'), Object.fromEntries(MINS.map(m => [m, minsLabel(m)])), k => p.mins === +k, k => { p.mins = +k; renderEdit(); });
    opts(qq('energy'), ENERGY, k => p.energy === k, k => { p.energy = k; renderEdit(); });
    opts(qq('kind'), KINDS, k => p.kind === k, k => { p.kind = k; renderEdit(); });
    $('eBeenH').textContent = p.been.length ? `Been ${p.been.length}× · last ${ago(p.been[p.been.length - 1])}` : 'Not been yet';
    $('eBeen').textContent = p.been.includes(today()) ? 'Unmark today' : 'Been today';
  }
  function openEdit(p) { editing = p; $('eName').value = p.name; $('eArea').value = p.area || ''; $('eNote').value = p.note || ''; renderEdit(); open('edit'); }
  function commitEdit() {
    if (!editing) return;
    editing.name = $('eName').value.trim() || editing.name; editing.area = $('eArea').value.trim(); editing.note = $('eNote').value.trim();
    delete editing.guessed; save(); editing = null;
  }
  $('eBeen').addEventListener('click', () => {
    const p = editing, d = today();
    p.been = p.been.includes(d) ? p.been.filter(x => x !== d) : [...p.been, d]; save(); renderEdit();
  });
  $('eDel').addEventListener('click', () => {
    const p = editing, i = state.places.indexOf(p); editing = null;
    state.places.splice(i, 1); save(); $('edit').hidden = true;
    if (current === p) current = null;
    refresh(); toast('Removed ' + p.name, () => { state.places.splice(i, 0, p); save(); refresh(); });
  });

  let tt;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg; $('toastUndo').hidden = !undo;
    $('toastUndo').onclick = () => { undo && undo(); $('toast').classList.remove('show'); };
    $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), undo ? 4500 : 2200);
  }

  function refresh() {
    if (current && (!state.places.includes(current) || !fits(current))) current = null;
    renderAsk(); renderMap(); renderCard();
  }
  buildMap(); refresh();

  // ---------- today's weather: one symbol, from Open-Meteo (no key needed) ----------
  const WX_ICONS = {
    sun:   '<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/>',
    part:  '<circle cx="18" cy="17" r="6"/><path d="M18 5v3M6 17h3M9.5 8.5l2.1 2.1M26.5 8.5l-2.1 2.1"/><path d="M15 38h20a7 7 0 0 0 .6-14 9 9 0 0 0-17.2 2.4A5.8 5.8 0 0 0 15 38z"/>',
    cloud: '<path d="M12 36h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 36z"/>',
    rain:  '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M16 35l-2 5M24 35l-2 5M32 35l-2 5"/>',
    snow:  '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M16 36v.1M24 39v.1M32 36v.1M20 43v.1M28 43v.1" stroke-width="3.4"/>',
    storm: '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M25 31l-4 7h6l-4 7"/>',
    fog:   '<path d="M10 18h28M6 25h32M12 32h28M8 39h20"/>',
  };
  const wxKind = c => c === 0 ? 'sun' : c <= 2 ? 'part' : c === 3 ? 'cloud' : c <= 48 ? 'fog' : c <= 67 ? 'rain' : c <= 77 ? 'snow' : c <= 82 ? 'rain' : c <= 86 ? 'snow' : 'storm';
  const WX_WORD = { sun:'Sunny', part:'Sunny spells', cloud:'Cloudy', rain:'Rain', snow:'Snow', storm:'Thunder', fog:'Fog' };
  // the forecast decides the weather for the day; the symbol only shows it
  function showWx(w) {
    const k = wxKind(w.code), wet = ['rain', 'snow', 'storm'].includes(k) || w.pop >= 60;
    $('wx').innerHTML = `<span class="deg">${Math.round(w.max)}°</span><svg viewBox="0 0 48 48" aria-hidden="true">${WX_ICONS[k]}</svg>`;
    $('wx').setAttribute('aria-label', `Today in Belfast: ${WX_WORD[k]}, ${Math.round(w.max)}°${w.pop != null ? `, ${w.pop}% chance of rain` : ''}`);
    $('wx').hidden = false;
    state.f.wx = wet ? 'rain' : 'dry'; refresh();
  }
  (async () => {
    try {
      const c = JSON.parse(localStorage.getItem(LS + '-wx') || 'null');
      if (c && c.day === today() && Date.now() - c.at < 3 * 36e5) return showWx(c);
    } catch (e) {}
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=54.597&longitude=-5.930&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FLondon&forecast_days=1');
      const d = (await r.json()).daily;
      const w = { day:today(), at:Date.now(), code:d.weather_code[0], max:d.temperature_2m_max[0], pop:d.precipitation_probability_max[0] };
      try { localStorage.setItem(LS + '-wx', JSON.stringify(w)); } catch (e) {}
      showWx(w);
    } catch (e) { /* no forecast here: no symbol, and weather doesn't filter */ }
  })();
}
</script>
</body>
</html>

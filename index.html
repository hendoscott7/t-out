<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9cbe8">
<title>T-Out</title>
<style>
  :root { --sky:#a9cbe8; --ink:#111; --soft:rgba(17,17,17,.55); --faint:rgba(17,17,17,.16); --paper:#f7f6f2; --ease:cubic-bezier(.65,0,.2,1); }
  * { box-sizing:border-box; margin:0; }
  html { background:var(--sky); }
  body { font:400 15px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--sky);
         -webkit-font-smoothing:antialiased; height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
         padding:calc(16px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom)); }
  button, input, textarea { font:inherit; color:inherit; }
  button { background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  a { color:inherit; }
  svg { display:block; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; border-radius:4px; }

  /* masthead */
  .mast { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex:none; }
  .word { font-weight:700; font-size:clamp(52px, min(12vw, 15vh), 160px); line-height:.82; letter-spacing:-.06em; margin-left:-.04em; }
  .side { display:flex; flex-direction:column; align-items:flex-end; gap:10px; padding-top:6px; }
  .date { font-size:13px; font-weight:500; text-align:right; line-height:1.25; }
  .today { display:flex; align-items:center; gap:12px; }
  .wx { width:52px; height:52px; margin-top:4px; display:grid; place-items:center; animation:rise .5s var(--ease) both; }
  .wx svg { width:52px; height:52px; stroke:var(--ink); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
  .wx:active { transform:scale(.92); }
  .tools { display:flex; gap:6px; }
  .tool { height:36px; padding:0 14px; border:1.5px solid var(--ink); border-radius:18px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px; }
  .tool:active, .tool.on { background:var(--ink); color:var(--sky); }

  /* the sentence */
  .ask { flex:none; margin-top:clamp(12px, 2.5vh, 28px); font-size:clamp(21px, min(4.2vw, 4.4vh), 44px); line-height:1.12; letter-spacing:-.025em; font-weight:500; max-width:22ch; }
  .ask button { font-weight:500; text-decoration:underline; text-decoration-thickness:.07em; text-underline-offset:.12em;
                text-decoration-color:var(--soft); transition:text-decoration-color .15s; }
  .ask button.set { text-decoration-color:var(--ink); }
  .ask button:active { opacity:.6; }
  .ask .any { color:var(--soft); }
  .hint { flex:none; margin-top:8px; font-size:13px; color:var(--soft); }

  /* stage */
  .stage { flex:1; min-height:0; margin-top:clamp(8px, 2vh, 24px); display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); gap:12px 56px; align-items:center; max-width:1280px; width:100%; }
  .rings { position:relative; height:100%; max-height:620px; aspect-ratio:1; max-width:100%; justify-self:center; align-self:center; min-height:0; }
  .rings svg { width:100%; height:100%; overflow:visible; }
  .ring { fill:none; stroke:var(--faint); stroke-width:.5; }
  .ring.k { stroke:var(--ink); stroke-opacity:.35; }
  .spoke { stroke:var(--faint); stroke-width:.5; }
  .rl { font-size:4.2px; fill:var(--soft); font-weight:500; }
  .sl { font-size:5.4px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; cursor:pointer; }
  .sl.off { fill-opacity:.3; }
  .home { fill:var(--ink); }
  .pin { font-size:5.6px; font-weight:700; letter-spacing:-.01em; paint-order:stroke; stroke:var(--sky); stroke-width:2.4px; stroke-linejoin:round; pointer-events:none; }
  .dot { cursor:pointer; transition:opacity .25s, transform .3s var(--ease); transform-box:fill-box; transform-origin:center; }
  .dot circle { fill:var(--ink); stroke:var(--ink); stroke-width:.9; }
  .dot.been circle { fill:var(--sky); }
  .dot.out { opacity:.18; }
  .dot.mine circle.m { fill:none; stroke-width:.6; }
  .dot:hover { transform:scale(1.5); }
  .dot.sel { transform:scale(1.9); }
  .sweep { transform-origin:0 0; opacity:0; }
  .sweep.go { animation:sweep .75s var(--ease); }
  @keyframes sweep { 0% { opacity:1; transform:rotate(0deg); } 85% { opacity:1; } 100% { opacity:0; transform:rotate(360deg); } }
  .halo { fill:none; stroke:var(--ink); stroke-width:.4; opacity:0; transform-box:fill-box; transform-origin:center; }
  .halo.on { animation:halo 1.6s ease-out 1; opacity:0; }
  @keyframes halo { from { transform:scale(1); opacity:.9; } to { transform:scale(5); opacity:0; } }

  /* card */
  .card { background:var(--paper); border-radius:28px; padding:22px 22px 18px; min-height:280px; display:flex; flex-direction:column;
          box-shadow:0 18px 40px -22px rgba(0,0,0,.45); }
  .card .meta { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:12px; font-weight:500; padding:4px 9px; border:1px solid var(--ink); border-radius:12px; }
  .tag.fill { background:var(--ink); color:var(--paper); }
  .card h2 { margin-top:22px; font-size:clamp(34px, 4.6vw, 56px); font-weight:700; line-height:.95; letter-spacing:-.045em; cursor:pointer; }
  .card .where { margin-top:10px; color:var(--soft); }
  .card .note { margin-top:16px; line-height:1.4; max-width:34ch; }
  .card .acts { margin-top:auto; padding-top:24px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .act { height:50px; border-radius:25px; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; gap:7px;
         font-size:14px; font-weight:500; text-decoration:none; }
  .act.main { background:var(--ink); color:var(--paper); }
  .act:active { transform:scale(.97); }
  .act.on { background:var(--sky); }
  .card.idle h2 { color:var(--soft); cursor:default; }
  .card.landed > * { animation:rise .4s var(--ease) both; }
  .card.landed > :nth-child(2) { animation-delay:.04s; } .card.landed > :nth-child(3) { animation-delay:.08s; } .card.landed > :nth-child(4) { animation-delay:.12s; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }

  /* sheets */
  .modal { position:fixed; inset:0; z-index:20; background:rgba(17,17,17,.28); display:flex; align-items:flex-end; justify-content:center; animation:fade .18s; }
  .sheet { width:min(620px, 100%); max-height:92vh; overflow:auto; background:var(--paper); border-radius:32px 32px 0 0;
           padding:12px 24px calc(24px + env(safe-area-inset-bottom)); animation:up .3s var(--ease); }
  .grab { width:40px; height:4px; border-radius:4px; background:var(--faint); margin:0 auto 18px; }
  .sheet h2 { font-size:34px; font-weight:700; letter-spacing:-.04em; line-height:1; }
  .sheet .sub { color:var(--soft); margin-top:8px; line-height:1.4; }
  .sheet h3 { font-size:12px; font-weight:500; color:var(--soft); margin:22px 0 8px; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .opt { font-size:14px; padding:8px 13px; border:1.5px solid var(--ink); border-radius:18px; }
  .opt.on { background:var(--ink); color:var(--paper); }
  .field { width:100%; background:#fff; border:1.5px solid var(--faint); border-radius:8px; padding:12px 14px; outline:none; }
  .field:focus { border-color:var(--ink); }
  textarea.field { min-height:120px; resize:vertical; font-size:14px; }
  .row { display:flex; gap:6px; margin-top:22px; }
  .row > * { flex:1; }
  .danger { color:#c2372f; border-color:#c2372f !important; }
  .small { font-size:13px; color:var(--soft); line-height:1.5; margin-top:14px; }
  .small ol { padding-left:18px; }

  /* index */
  .seg { display:flex; gap:6px; margin:16px 0 4px; }
  .idx h4 { font-size:12px; font-weight:500; color:var(--soft); margin:22px 0 2px; display:flex; justify-content:space-between; }
  .idx ul { list-style:none; padding:0; }
  .idx li button { width:100%; display:grid; grid-template-columns:1fr auto; gap:2px 12px; text-align:left; padding:11px 0; border-bottom:1px solid var(--faint); }
  .idx .n { font-size:18px; font-weight:500; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; }
  .idx .r { font-size:13px; color:var(--soft); text-align:right; align-self:center; white-space:nowrap; }
  .idx .a { font-size:13px; color:var(--soft); }
  .idx .o { width:7px; height:7px; border-radius:50%; background:#e2763b; flex:none; }
  .idx .y { width:7px; height:7px; border-radius:50%; border:1.5px solid var(--ink); flex:none; }
  .idx.out li { opacity:.35; }

  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:30; transform:translate(-50%, 14px); background:var(--ink); color:var(--paper);
           padding:13px 18px; border-radius:24px; font-size:14px; display:flex; gap:16px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
           width:max-content; max-width:calc(100vw - 32px); }
  .toast.show { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .toast button { text-decoration:underline; text-underline-offset:3px; font-weight:500; }

  @keyframes up { from { transform:translateY(100%); } }
  @keyframes fade { from { opacity:0; } }
  @media (max-width:820px) {
    body { padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)); }
    .ask { max-width:none; }
    .stage { grid-template-columns:minmax(0, 1fr); grid-template-rows:minmax(0, 1fr) auto; align-items:stretch; }
    .rings { width:auto; }
    .card { min-height:0; padding:16px 18px 14px; border-radius:26px; }
    .card h2 { margin-top:12px; font-size:clamp(26px, 7.5vw, 38px); }
    .card .where { margin-top:6px; font-size:14px; }
    .card .note { margin-top:8px; font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card .acts { padding-top:14px; }
    .act { height:46px; }
    .tag { font-size:11px; padding:3px 8px; }
  }
  @media (max-height:640px) { .hint { display:none; } .card .note { display:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <header class="mast">
    <h1 class="word">T-Out</h1>
    <button class="wx" id="wx" hidden></button>
  </header>

  <p class="ask" id="ask" aria-live="polite"></p>
  <p class="hint" id="hint"></p>

  <main class="stage">
    <figure class="rings" id="rings" aria-label="Places by travel time from home"></figure>
    <article class="card idle" id="card"></article>
  </main>

  <!-- edit -->
  <div class="modal" id="edit" hidden>
    <div class="sheet"><div class="grab"></div>
      <input class="field" id="eName" style="font-size:24px;font-weight:700;letter-spacing:-.02em" aria-label="Name">
      <input class="field" id="eArea" placeholder="Area, e.g. Dundonald" style="margin-top:6px" aria-label="Area">
      <h3>Inside or out</h3><div class="opts" data-e="where"></div>
      <h3>Cost</h3><div class="opts" data-e="cost"></div>
      <h3>Travel from home</h3><div class="opts" data-e="mins"></div>
      <h3>Mood</h3><div class="opts" data-e="energy"></div>
      <h3>Kind</h3><div class="opts" data-e="kind"></div>
      <h3>Note</h3><textarea class="field" id="eNote" style="min-height:70px" placeholder="Toddler mornings, bring wellies…"></textarea>
      <h3 id="eBeenH"></h3>
      <div class="row"><a class="act" id="eMap" target="_blank" rel="noopener">Maps</a><button class="act" id="eBeen">Been today</button><button class="act danger" id="eDel">Remove</button></div>
      <div class="row"><button class="act main" data-close>Done</button></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const LS = 't-out';
  const NS = 'http://www.w3.org/2000/svg';

  const KINDS = { park:'Park & playground', woods:'Woods & trails', beach:'Beach', animals:'Animals', play:'Soft play', museum:'Museum', space:'Space', group:'Groups & classes', market:'Market', other:'Other' };
  const WHERE = { in:'Inside', out:'Outside', both:'In & out' };
  const COST = ['Free', '£', '££'];
  const MINS = [10, 20, 30, 45, 60, 90];
  const ENERGY = { run:'Run it off', calm:'Calm', mix:'Bit of both' };
  // the rings are cut into six slices
  const SECTORS = [
    ['Outdoors', ['park', 'woods', 'beach']],
    ['Animals', ['animals']],
    ['Play', ['play']],
    ['Museums', ['museum', 'space']],
    ['Groups', ['group', 'market']],
    ['Other', ['other']],
  ];
  const sectorOf = k => Math.max(0, SECTORS.findIndex(s => s[1].includes(k)));

  const IDEAS = [
    ['victoria', 'Victoria Park', 'East Belfast', 'park', 'out', 0, 10, 'run', 'Lake full of swans, geese and ducks, plus a big playpark.'],
    ['waterworks', 'Waterworks', 'Antrim Road', 'park', 'out', 0, 10, 'run', 'Ponds for duck spotting and two playgrounds.'],
    ['botanic', 'Botanic Gardens', 'South Belfast', 'park', 'both', 0, 5, 'mix', 'Palm House and Tropical Ravine when it rains. Free council playgroup for under-5s on Thursday afternoons in the bowling pavilion.'],
    ['ormeau', 'Ormeau Park', 'Ormeau Road', 'park', 'out', 0, 5, 'run', 'Refurbished lower playground and eco trails.'],
    ['momowlam', 'Mo Mowlam Play Park', 'Stormont', 'park', 'out', 0, 15, 'run', 'Toddler area, sensory zone and inclusive kit. Free.'],
    ['dixon', 'Sir Thomas & Lady Dixon Park', 'Malone', 'park', 'out', 0, 15, 'run', 'Meadows to run in and a playground.'],
    ['cavehill', 'Cave Hill Country Park', 'North Belfast', 'park', 'out', 0, 15, 'run', 'Adventurous playground by the castle, woodland walks.'],
    ['gruffalo', 'Gruffalo Trail, Colin Glen', 'West Belfast', 'woods', 'out', 0, 20, 'run', 'Ireland’s official Gruffalo Trail. Short, buggy-able, characters to find.'],
    ['minnowburn', 'Minnowburn', 'Shaw’s Bridge', 'woods', 'out', 0, 15, 'mix', 'National Trust riverside and woods. Puddles guaranteed.'],
    ['crawfordsburn', 'Crawfordsburn Country Park', 'Helen’s Bay', 'beach', 'out', 0, 25, 'run', 'Sandy beach, a waterfall walk and a café.'],
    ['ulstermuseum', 'Ulster Museum', 'Botanic', 'museum', 'in', 0, 5, 'calm', 'Free. Discovery zones and a dinosaur or two.'],
    ['folkmuseum', 'Ulster Folk & Transport Museum', 'Cultra', 'museum', 'both', 2, 20, 'mix', 'Trains, buses and an old village to wander.'],
    ['w5', 'W5', 'Odyssey', 'museum', 'in', 2, 10, 'run', 'Science centre with a storybook under-8s area. Ticket lasts all day.'],
    ['rhyme', 'Rhythm & Rhyme', 'Any Libraries NI branch', 'group', 'in', 0, 10, 'calm', 'Free songs and stories for 0–4s, about 30 minutes. Book ahead. Central Library is Wednesdays at 11.'],
    ['market', 'St George’s Market', 'City centre', 'market', 'in', 0, 5, 'calm', 'Weekend market with live music and plenty to look at.'],
    ['roar', 'Roar and Explore', 'Belfast', 'play', 'in', 1, 10, 'run', 'Animal-themed soft play with its own under-3s area. Cheaper toddler mornings on weekdays.'],
    ['grove', 'Grove Wellbeing Centre soft play', 'York Road', 'play', 'in', 1, 10, 'run', 'Safari soft play, about £4. Free Rhythm & Rhyme on Fridays too.'],
    ['funtastic', 'Funtastic', 'Carryduff', 'play', 'in', 1, 20, 'run', 'Soft play with a toddler area. Cheaper toddler mornings.'],
    ['airtastic', 'Airtastic soft play', 'Newtownabbey', 'play', 'in', 1, 20, 'run', 'Weekday toddler mornings with juice and biscuits. Walk in, no booking.'],
    ['zoo', 'Belfast Zoo', 'Cave Hill', 'animals', 'out', 2, 15, 'mix', 'Hilly, so take the buggy and go early.'],
    ['streamvale', 'Streamvale Open Farm', 'Dundonald', 'animals', 'both', 1, 20, 'mix', 'Bottle-feed lambs, tractor rides, indoor play. Toddler tickets are cheap. Open spring to autumn, so check.'],
    ['laganvale', 'Laganvale Farm', 'Lisburn', 'animals', 'both', 1, 20, 'mix', 'Farm and soft play. In term time the outdoor bit only opens on Saturdays.'],
    ['stjames', 'St James Community Farm', 'West Belfast', 'animals', 'out', 1, 10, 'calm', 'Small city farm with about 50 animals. Check opening times.'],
    ['exploris', 'Exploris Aquarium', 'Portaferry', 'animals', 'in', 2, 60, 'calm', 'Fish, rays and seal rescue. Good for a whole day out.'],
    ['mountpanther', 'Mountpanther Farm Park', 'Clough, near Newcastle', 'animals', 'out', 1, 45, 'run', 'Bouncy pillow, sandpit, ride-on tractors and a small play village.'],
    ['armagh', 'Armagh Planetarium', 'Armagh', 'space', 'in', 1, 60, 'calm', 'Under-3s go free. Pick the pre-school dome show; some shows are for over-6s or over-8s. Book ahead.'],
  ];

  const blankF = () => ({ wx:'any', energy:'any', cost:'any', near:0, pool:'any', sector:-1 });
  const blank = () => ({ v:2, places:[], last:[], f:blankF(), list:'all', seeded:[] });
  let state;
  try { state = JSON.parse(localStorage.getItem(LS)) || blank(); } catch (e) { state = blank(); }
  state = Object.assign(blank(), state); state.f = Object.assign(blankF(), state.f);
  IDEAS.forEach(([id, name, area, kind, where, cost, mins, energy, note]) => {
    if (state.seeded.includes(id)) return;
    state.seeded.push(id);
    state.places.push({ id, name, area, kind, where, cost, mins, energy, note, mine:false, been:[] });
  });
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };
  save();

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const mapUrl = p => p.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' ' + (p.area || '') + ' Northern Ireland')}`;
  const minsLabel = m => m >= 90 ? '90+ min' : m + ' min';
  const today = () => new Date().toISOString().slice(0, 10);
  const ago = d => { const n = Math.round((Date.now() - new Date(d)) / 864e5); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n < 14 ? n + ' days ago' : n < 60 ? Math.round(n / 7) + ' weeks ago' : Math.round(n / 30) + ' months ago'; };
  const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };

  // ---------- the sentence ----------
  // each underlined phrase cycles through its options
  const ASK = {
    wx:     [['any', 'Any weather'], ['rain', 'It’s raining'], ['dry', 'It’s dry']],
    energy: [['any', 'any mood'], ['run', 'run him ragged'], ['calm', 'keep it calm']],
    cost:   [['any', 'any price'], ['free', 'free'], ['cheap', 'cheap']],
    near:   [[0, 'any distance'], [15, 'under 15 min'], [30, 'under 30 min'], [60, 'under an hour']],
    pool:   [['any', 'anywhere'], ['new', 'somewhere new'], ['mine', 'off our list']],
  };
  function renderAsk() {
    const b = k => { const o = ASK[k].find(x => x[0] === state.f[k]) || ASK[k][0];
      return `<button data-k="${k}" class="${o[0] === ASK[k][0][0] ? 'any' : 'set'}" aria-label="${k}: ${o[1]}, tap to change">${o[1]}</button>`; };
    $('ask').innerHTML = `${b('wx')}, ${b('energy')}, ${b('cost')}, ${b('near')}, ${b('pool')}.`;
    const n = state.places.filter(fits).length, sec = state.f.sector >= 0 ? ` · ${SECTORS[state.f.sector][0]} only` : '';
    $('hint').textContent = `${n} of ${state.places.length} places fit${sec}. Tap the underlined words.`;
  }
  $('ask').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k, opts = ASK[k], i = opts.findIndex(x => x[0] === state.f[k]);
    state.f[k] = opts[(i + 1) % opts.length][0]; save(); refresh();
  });

  function fits(p) {
    const f = state.f;
    if (f.wx === 'rain' && p.where === 'out') return false;
    if (f.wx === 'dry' && p.where === 'in') return false;
    if (f.cost === 'free' && p.cost > 0) return false;
    if (f.cost === 'cheap' && p.cost > 1) return false;
    if (+f.near && p.mins > +f.near) return false;
    if (f.energy !== 'any' && p.energy !== f.energy && p.energy !== 'mix') return false;
    if (f.pool === 'new' && p.been.length) return false;
    if (f.pool === 'mine' && !p.mine) return false;
    if (f.sector >= 0 && sectorOf(p.kind) !== f.sector) return false;
    return true;
  }

  // ---------- rings ----------
  const RMAX = 92;
  const R = m => RMAX * Math.min(1, (Math.log(Math.max(m, 4)) - Math.log(4)) / (Math.log(100) - Math.log(4)));
  const pos = p => {
    const s = sectorOf(p.kind), w = 2 * Math.PI / SECTORS.length;
    const a = -Math.PI / 2 + s * w + w * (0.12 + 0.76 * hash(p.id));
    const r = Math.max(8, R(p.mins) + (hash(p.id + 'r') - .5) * 6);
    return [r * Math.cos(a), r * Math.sin(a)];
  };
  const el = (t, a, parent) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); parent && parent.appendChild(n); return n; };
  let svg, dotsG, sweep, halo;
  function buildRings() {
    svg = el('svg', { viewBox:'-112 -112 224 224', role:'group' });
    [10, 20, 30, 60, 90].forEach(m => {
      el('circle', { r:R(m), class:'ring' + (m === 30 ? ' k' : '') }, svg);
      const t = el('text', { x:1.5, y:-R(m) - 1.2, class:'rl' }, svg); t.textContent = m >= 90 ? '90+' : m + '′';
    });
    const w = 2 * Math.PI / SECTORS.length;
    SECTORS.forEach(([name], i) => {
      const a = -Math.PI / 2 + i * w;
      el('line', { x1:0, y1:0, x2:RMAX * Math.cos(a), y2:RMAX * Math.sin(a), class:'spoke' }, svg);
      const m = a + w / 2, t = el('text', { x:(RMAX + 10) * Math.cos(m), y:(RMAX + 10) * Math.sin(m) + 2, 'text-anchor':'middle', class:'sl', 'data-s':i, tabindex:0, role:'button' }, svg);
      t.textContent = name;
    });
    sweep = el('g', { class:'sweep' }, svg);
    el('path', { d:`M0 0L${RMAX} 0A${RMAX} ${RMAX} 0 0 0 ${RMAX * Math.cos(-.5)} ${RMAX * Math.sin(-.5)}Z`, fill:'#111', 'fill-opacity':.1 }, sweep);
    el('line', { x1:0, y1:0, x2:RMAX, y2:0, stroke:'#111', 'stroke-width':.8 }, sweep);
    dotsG = el('g', {}, svg);
    halo = el('circle', { r:4, class:'halo' }, svg);
    el('circle', { r:2.6, class:'home' }, svg);
    $('rings').appendChild(svg);
    svg.addEventListener('click', e => {
      const s = e.target.closest('.sl'); if (s) { const i = +s.dataset.s; state.f.sector = state.f.sector === i ? -1 : i; save(); refresh(); return; }
      const d = e.target.closest('.dot'); if (d) select(state.places.find(p => p.id === d.dataset.id), true);
    });
    svg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles:true })); } });
  }
  function renderRings() {
    dotsG.innerHTML = '';
    // draw non-fitting first so fitting dots sit on top
    [...state.places].sort((a, b) => fits(a) - fits(b)).forEach(p => {
      const [x, y] = pos(p), ok = fits(p);
      const at = el('g', { transform:`translate(${x.toFixed(2)} ${y.toFixed(2)})` }, dotsG);
      const g = el('g', { class:`dot${ok ? '' : ' out'}${p.been.length ? ' been' : ''}${p.mine ? ' mine' : ''}${current === p ? ' sel' : ''}`, 'data-id':p.id,
        tabindex:ok ? 0 : -1, role:'button', 'aria-label':`${p.name}, ${minsLabel(p.mins)}` }, at);
      el('circle', { r:2.4 }, g);
      if (p.mine) el('circle', { r:4.2, class:'m' }, g);
      el('title', {}, g).textContent = p.name;
    });
    if (current) {
      const [x, y] = pos(current), right = x < 40;
      const t = el('text', { x:x + (right ? 8 : -8), y:y + 1.8, 'text-anchor':right ? 'start' : 'end', class:'pin' }, dotsG);
      t.textContent = current.name.length > 26 ? current.name.slice(0, 24) + '…' : current.name;
    }
    svg.querySelectorAll('.sl').forEach((t, i) => t.classList.toggle('off', state.f.sector >= 0 && state.f.sector !== i));
  }

  // ---------- card ----------
  let current = null;
  function renderCard(animate) {
    const c = $('card'), p = current;
    c.classList.toggle('idle', !p); c.classList.remove('landed');
    if (!p) {
      const n = state.places.filter(fits).length;
      c.innerHTML = `<div class="meta"><span class="tag">${n ? n + ' to choose from' : 'Nothing fits'}</span></div>
        <h2>${n ? 'Where to, Theo?' : 'Try fewer underlines.'}</h2>
        <p class="note">Further out means a longer drive. Filled dots: not been yet.</p>
        <div class="acts" style="grid-template-columns:1fr"><button class="act main" data-a="pick" ${n ? '' : 'disabled'}>Pick for me</button></div>`;
      return;
    }
    const went = p.been.includes(today());
    c.innerHTML = `<div class="meta"><span class="tag fill">${KINDS[p.kind]}</span><span class="tag">${WHERE[p.where]}</span><span class="tag">${COST[p.cost]}</span><span class="tag">${minsLabel(p.mins)}</span></div>
      <h2 data-a="edit" title="Edit">${esc(p.name)}</h2>
      <p class="where">${esc([p.area, p.been.length ? 'last went ' + ago(p.been[p.been.length - 1]) : 'never been'].filter(Boolean).join(' · '))}</p>
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
      <div class="acts">
        <button class="act" data-a="pick" aria-label="Pick another"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5M20 4v4.5h-4.5"/></svg>Another</button>
        <a class="act" href="${esc(mapUrl(p))}" target="_blank" rel="noopener">Maps</a>
        <button class="act main ${went ? 'on' : ''}" data-a="been" style="${went ? 'color:var(--ink)' : ''}">${went ? '✓ Went' : 'We went'}</button>
      </div>`;
    if (animate) { void c.offsetWidth; c.classList.add('landed'); }
  }
  $('card').addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'pick') pick();
    if (a.dataset.a === 'been') { toggleBeen(current); renderCard(); renderRings(); }
    if (a.dataset.a === 'edit') openEdit(current);
  });
  function select(p, animate) {
    current = p; renderRings(); renderCard(animate);
    if (p && animate) { const [x, y] = pos(p); halo.setAttribute('cx', x); halo.setAttribute('cy', y); halo.classList.remove('on'); void halo.getBBox(); halo.classList.add('on'); }
  }

  // ---------- pick ----------
  function weight(p) {
    let w = p.been.length ? 1 : 2.5;
    if (p.mine) w *= 1.6;
    const i = state.last.indexOf(p.id);
    if (i > -1) w *= 0.05 + i * 0.12;
    if (p.been.length && (Date.now() - new Date(p.been[p.been.length - 1])) < 7 * 864e5) w *= 0.2;
    return w;
  }
  let busy = false;
  function pick() {
    if (busy) return;
    const c = state.places.filter(fits).filter(p => p !== current);
    if (!c.length) { toast(current ? 'That’s the only one that fits' : 'Nothing fits — tap an underline to loosen it'); return; }
    let r = Math.random() * c.reduce((s, p) => s + weight(p), 0), win = c[c.length - 1];
    for (const p of c) { r -= weight(p); if (r <= 0) { win = p; break; } }
    state.last = [win.id, ...state.last.filter(x => x !== win.id)].slice(0, 6); save();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return select(win, true);
    busy = true; current = null; renderRings();
    sweep.classList.remove('go'); void sweep.getBBox(); sweep.classList.add('go');
    setTimeout(() => { busy = false; select(win, true); }, 700);
  }
  function toggleBeen(p) {
    const d = today();
    if (p.been.includes(d)) { p.been = p.been.filter(x => x !== d); toast('Unmarked'); }
    else { p.been.push(d); toast('Logged. Nice one'); }
    save(); renderAsk();
  }

  // ---------- sheets ----------
  const open = id => { $(id).hidden = false; };
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => {
    if (e.target === m || e.target.closest('[data-close]')) { m.hidden = true; if (m.id === 'edit') commitEdit(); refresh(); }
  }));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const m = [...document.querySelectorAll('.modal')].find(m => !m.hidden);
    if (m) { m.hidden = true; if (m.id === 'edit') commitEdit(); refresh(); }
  });
  function opts(box, map, isOn, onPick) {
    box.innerHTML = Object.entries(map).map(([k, l]) => `<button class="opt ${isOn(k) ? 'on' : ''}" data-k="${k}">${l}</button>`).join('');
    box.onclick = e => { const b = e.target.closest('.opt'); if (b) { onPick(b.dataset.k); save(); } };
  }

  // edit
  let editing = null, backToIdx = false;
  function renderEdit() {
    const p = editing, q = s => document.querySelector(`[data-e="${s}"]`);
    opts(q('where'), WHERE, k => p.where === k, k => { p.where = k; renderEdit(); });
    opts(q('cost'), Object.fromEntries(COST.map((c, i) => [i, c])), k => p.cost === +k, k => { p.cost = +k; renderEdit(); });
    opts(q('mins'), Object.fromEntries(MINS.map(m => [m, minsLabel(m)])), k => p.mins === +k, k => { p.mins = +k; renderEdit(); });
    opts(q('energy'), ENERGY, k => p.energy === k, k => { p.energy = k; renderEdit(); });
    opts(q('kind'), KINDS, k => p.kind === k, k => { p.kind = k; renderEdit(); });
    $('eBeenH').textContent = p.been.length ? `Been ${p.been.length}× · last ${ago(p.been[p.been.length - 1])}` : 'Not been yet';
    $('eBeen').textContent = p.been.includes(today()) ? 'Unmark today' : 'Been today';
    $('eMap').href = mapUrl(p);
  }
  function openEdit(p, fromIdx) {
    editing = p; backToIdx = !!fromIdx; $('eName').value = p.name; $('eArea').value = p.area || ''; $('eNote').value = p.note || '';
    renderEdit(); open('edit');
  }
  function commitEdit() {
    if (!editing) return;
    editing.name = $('eName').value.trim() || editing.name; editing.area = $('eArea').value.trim(); editing.note = $('eNote').value.trim();
    delete editing.guessed; save(); editing = null;
  }
  $('eBeen').addEventListener('click', () => { toggleBeen(editing); renderEdit(); });
  $('eDel').addEventListener('click', () => {
    const p = editing, i = state.places.indexOf(p); editing = null;
    state.places.splice(i, 1); save(); $('edit').hidden = true;
    if (current === p) current = null;
    refresh(); toast('Removed ' + p.name, () => { state.places.splice(i, 0, p); save(); refresh(); });
  });

  // add / import
  function guess(name, note = '') {
    const s = (name + ' ' + note).toLowerCase();
    const g = { kind:'other', where:'both', cost:1, mins:20, energy:'mix' };
    const set = o => Object.assign(g, o);
    if (/planetarium|observatory|space|science/.test(s)) set({ kind:'space', where:'in', cost:1, energy:'calm' });
    else if (/soft ?play|play ?(centre|center|house|zone|barn)|jungle|monkey|bounce|trampolin|airtastic|funtastic|clip/.test(s)) set({ kind:'play', where:'in', cost:1, energy:'run' });
    else if (/zoo/.test(s)) set({ kind:'animals', where:'out', cost:2 });
    else if (/aquarium|exploris|sea ?life/.test(s)) set({ kind:'animals', where:'in', cost:2, energy:'calm' });
    else if (/farm|pets|animal|alpaca|donkey|petting/.test(s)) set({ kind:'animals', where:'both', cost:1 });
    else if (/library|rhyme|toddler group|class|sensory|music|tots/.test(s)) set({ kind:'group', where:'in', cost:0, energy:'calm' });
    else if (/museum|gallery|w5|centre|castle/.test(s)) set({ kind:'museum', where:'in', cost:1, energy:'calm' });
    else if (/beach|strand|bay|shore|harbour/.test(s)) set({ kind:'beach', where:'out', cost:0, energy:'run' });
    else if (/forest|wood|glen|trail|walk|country park|nature|reserve/.test(s)) set({ kind:'woods', where:'out', cost:0, energy:'run' });
    else if (/park|garden|playground|play ?park|demesne|green/.test(s)) set({ kind:'park', where:'out', cost:0, energy:'run' });
    else if (/market/.test(s)) set({ kind:'market', where:'in', cost:0, energy:'calm' });
    return g;
  }
  function parseCSV(t) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) { if (c === '"' && t[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim()));
  }
  function addFrom(text) {
    text = text.replace(/^﻿/, '').trim(); if (!text) return 0;
    let items;
    if (/(^|,)\s*title\s*(,|$)/.test(text.split(/\r?\n/)[0].toLowerCase())) {
      const [h, ...rows] = parseCSV(text), hl = h.map(x => x.trim().toLowerCase()), ix = k => hl.indexOf(k);
      items = rows.map(r => ({ name:(r[ix('title')] || '').trim(), note:[r[ix('note')], r[ix('comment')]].filter(x => x && x.trim()).join(' — '), url:(r[ix('url')] || '').trim() }));
    } else items = text.split(/\r?\n/).map(l => ({ name:l.replace(/^[-•*\d.)\s]+/, '').trim(), note:'', url:'' }));
    let n = 0;
    const known = new Set(state.places.map(p => p.name.toLowerCase()));
    items.filter(i => i.name).forEach(i => {
      const k = i.name.toLowerCase();
      if (known.has(k)) { const p = state.places.find(p => p.name.toLowerCase() === k); p.mine = true; if (i.url) p.url = i.url; return; }
      known.add(k);
      state.places.push({ id:'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name:i.name, area:'', note:i.note, url:i.url || undefined, mine:true, guessed:true, been:[], ...guess(i.name, i.note) });
      n++;
    });
    save(); return n;
  }
  // toast
  let tt;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg; $('toastUndo').hidden = !undo;
    $('toastUndo').onclick = () => { undo && undo(); $('toast').classList.remove('show'); };
    $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), undo ? 4500 : 2200);
  }

  function refresh() {
    if (current && (!state.places.includes(current) || !fits(current))) current = null;
    renderAsk(); renderRings(); renderCard();
  }
    buildRings(); refresh();

  // ---------- today's weather: one symbol, from Open-Meteo (no key needed) ----------
  const WX_ICONS = {
    sun:   '<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/>',
    part:  '<circle cx="18" cy="17" r="6"/><path d="M18 5v3M6 17h3M9.5 8.5l2.1 2.1M26.5 8.5l-2.1 2.1"/><path d="M15 38h20a7 7 0 0 0 .6-14 9 9 0 0 0-17.2 2.4A5.8 5.8 0 0 0 15 38z"/>',
    cloud: '<path d="M12 36h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 36z"/>',
    rain:  '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M16 35l-2 5M24 35l-2 5M32 35l-2 5"/>',
    snow:  '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M16 36v.1M24 39v.1M32 36v.1M20 43v.1M28 43v.1" stroke-width="3.4"/>',
    storm: '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M25 31l-4 7h6l-4 7"/>',
    fog:   '<path d="M10 18h28M6 25h32M12 32h28M8 39h20"/>',
  };
  const wxKind = c => c === 0 ? 'sun' : c <= 2 ? 'part' : c === 3 ? 'cloud' : c <= 48 ? 'fog' : c <= 67 ? 'rain' : c <= 77 ? 'snow' : c <= 82 ? 'rain' : c <= 86 ? 'snow' : 'storm';
  const WX_WORD = { sun:'Sunny', part:'Sunny spells', cloud:'Cloudy', rain:'Rain', snow:'Snow', storm:'Thunder', fog:'Fog' };
  let wxToday = null;
  function showWx(w) {
    wxToday = w; const k = wxKind(w.code), wet = ['rain', 'snow', 'storm'].includes(k) || w.pop >= 60;
    w.wet = wet;
    const label = `${WX_WORD[k]}, ${Math.round(w.max)}°${w.pop != null ? `, ${w.pop}% chance of rain` : ''}`;
    $('wx').innerHTML = `<svg viewBox="0 0 48 48" aria-hidden="true">${WX_ICONS[k]}</svg>`;
    $('wx').title = label + '. Tap to match the weather.';
    $('wx').setAttribute('aria-label', `Today: ${label}. Tap to filter for it.`);
    $('wx').hidden = false;
    // first look of the day: let the forecast set the weather phrase, unless you've already chosen one
    if (state.wxSet !== today()) {
      state.wxSet = today();
      if (state.f.wx === 'any') { state.f.wx = wet ? 'rain' : 'dry'; save(); refresh(); toast(wet ? 'Rain forecast. Showing places that work in the wet' : 'Dry forecast. Outdoors is on'); }
      else save();
    }
  }
  $('wx').addEventListener('click', () => {
    if (!wxToday) return;
    const want = wxToday.wet ? 'rain' : 'dry';
    state.f.wx = state.f.wx === want ? 'any' : want; save(); refresh();
  });
  (async () => {
    try {
      const c = JSON.parse(localStorage.getItem(LS + '-wx') || 'null');
      if (c && c.day === today() && Date.now() - c.at < 3 * 36e5) return showWx(c);
    } catch (e) {}
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=54.597&longitude=-5.930&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FLondon&forecast_days=1');
      const d = (await r.json()).daily;
      const w = { day:today(), at:Date.now(), code:d.weather_code[0], max:d.temperature_2m_max[0], pop:d.precipitation_probability_max[0] };
      try { localStorage.setItem(LS + '-wx', JSON.stringify(w)); } catch (e) {}
      showWx(w);
    } catch (e) { /* offline: no symbol, nothing else changes */ }
  })();
})();
</script>
</body>

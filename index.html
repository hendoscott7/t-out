          --h0:#5fcb8a; --t0:rgba(95,203,138,.15); --h1:#f2905f; --t1:rgba(242,144,95,.15); --h2:#f27db4; --t2:rgba(242,125,180,.15);

  :root { --sea:#e9e9e6; --land:#fff; --town:#f1f1ef; --road:#cfcfca; }

  :root { --sea:#c9c9c5; --land:#e2e2df; }
  .credit-map { display:flex; align-items:center; gap:6px; flex-direction:row-reverse; }
  .credit-map button { width:20px; height:20px; border-radius:50%; font:italic 600 11px/20px Georgia, serif; color:var(--soft); background:color-mix(in srgb, var(--bg) 80%, transparent); box-shadow:0 0 0 1px var(--faint); }
  .credit-map span { display:none; font-size:10px; color:var(--soft); background:color-mix(in srgb, var(--bg) 85%, transparent); padding:3px 8px; border-radius:8px; max-width:220px; }
  .credit-map.open span { display:block; }
  .g-land { fill:var(--land); stroke:none; } .g-water { fill:var(--sea); stroke:none; } .g-town { fill:var(--town); stroke:none; }
  .g-road { fill:none; stroke:var(--road); stroke-width:1.2; }

  @keyframes ping { from { transform:scale(.6); opacity:1; } to { transform:scale(2.2); opacity:0; } }
  .lb { position:absolute; left:20px; top:-3px; white-space:nowrap; font-size:13px; font-weight:700; letter-spacing:-.01em; color:var(--ink);
        text-shadow:0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 6px var(--bg); pointer-events:none; }
  /* the shelf */
  .card { background:var(--paper); border-radius:28px; padding:24px; display:flex; flex-direction:column; box-shadow:0 18px 40px -22px var(--lift); max-height:100%; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; }
  .card::-webkit-scrollbar { display:none; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .tag { font-size:11px; font-weight:700; letter-spacing:.01em; padding:3px 8px 3px 7px; border-radius:6px; background:var(--tint); color:var(--c); display:inline-flex; align-items:center; gap:5px; }
  .tag::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .facts { font-size:12px; color:var(--soft); font-weight:500; }

  .card.idle h2 { color:var(--soft); cursor:default; }
  .where { margin-top:8px; color:var(--soft); }
  .photos { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; margin:16px -24px 0; padding:0 24px; scroll-padding:0 24px; scrollbar-width:none; touch-action:pan-x; }
  .photos::-webkit-scrollbar { display:none; }

  .ph { margin-top:16px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--soft); padding:6px 0; }
  .ph svg { transition:transform .25s var(--ease); }

  .credit { margin-top:8px; font-size:11px; color:var(--soft); }
  .note { margin-top:16px; line-height:1.4; max-width:36ch; }
  .acts { margin-top:auto; padding-top:40px; display:flex; gap:8px; }
  .act { height:50px; border-radius:25px; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:500; text-decoration:none; flex:1; }
  .act.round { width:36px; height:36px; flex:none; padding:0; border-radius:50%; border-width:1.25px; }
  .act.round svg { width:16px; height:16px; }
  .card { position:relative; }
  .act.corner { position:absolute; top:20px; right:20px; }
  .card:not(.idle) .meta { padding-right:48px; min-height:28px; }
  .act.main { background:var(--ink); color:var(--paper); }

  @media (min-width:821px) { .card.idle { padding-top:20px; padding-bottom:20px; } }

  /* edit sheet */

  .opts { display:flex; flex-wrap:wrap; gap:6px; }

  .field { width:100%; background:var(--bg); border:1.5px solid var(--faint); border-radius:12px; padding:12px 14px; outline:none; font-size:16px; }
  .field:focus { border-color:var(--ink); }
  .row { display:flex; gap:6px; margin-top:22px; }
  .danger { color:#d0453c; border-color:#d0453c !important; }

  .toast { position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top)); z-index:30; transform:translate(-50%, -14px); background:var(--ink); color:var(--bg);
           padding:12px 18px; border-radius:24px; font-size:14px; display:flex; gap:16px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; width:max-content; max-width:calc(100vw - 32px); }
  .toast.show { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }

  @keyframes up { from { transform:translateY(100%); } }
  @keyframes fade { from { opacity:0; } }

    .wx svg { width:38px; height:38px; } .wx .deg { font-size:22px; } .wx { height:38px; }

    .handle::before { content:""; position:absolute; left:50%; top:10px; width:40px; height:4px; margin-left:-20px; border-radius:2px; background:var(--faint); }
    .card.shut { padding-bottom:calc(20px + env(safe-area-inset-bottom)); }

    .card.shut .peek { display:flex; align-items:center; gap:8px; margin-top:-4px; min-height:36px; }
    .peek .pn { flex:1; font-size:20px; font-weight:700; letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    const h = $('card').offsetHeight;
    if (current && phone() && Math.abs(h - lastShelf) > 8) { lastShelf = h; centreOn(current, true); }
  }).observe($('card'));
  // the logo hops when tapped and bobs while something's on its way
  function hop() { const l = $('logo'); l.classList.remove('hop', 'busy'); void l.offsetWidth; l.classList.add('hop'); }
  function waiting(on) { const l = $('logo'); if (l && !l.classList.contains('hop')) l.classList.toggle('busy', on); }
  $('logo').addEventListener('animationend', e => e.animationName === 'hop' && $('logo').classList.remove('hop'));
  function centreOn(p, keepZoom) {
    if (!map || !p.at) return;
    const z = keepZoom ? map.getZoom() : Math.max(map.getZoom(), p.mins > 40 ? 10 : 13);
    const pt = map.project(p.at, z).add([0, (botH() - topH()) / 2]);
    if (!keepZoom) { waiting(true); map.once('moveend', () => waiting(false)); }
    keepZoom ? map.panTo(map.unproject(pt, z), { duration:.4 }) : map.flyTo(map.unproject(pt, z), z, { duration:.8 });
  }

  // ---------- photos: recent ones taken right at the place (Wikimedia Commons; only where the host allows it) ----------
  const PHOTO = {};
  try { Object.assign(PHOTO, JSON.parse(localStorage.getItem(LS + '-img2') || '{}')); } catch (e) {}
  const C = 'https://commons.wikimedia.org/w/api.php?format=json&origin=*&';
  async function photosFor(p) {
    if (PHOTO[p.id]) return PHOTO[p.id];
    let out = { page:null, imgs:[] };
    if (p.at) {
      const g = await (await fetch(C + `action=query&list=geosearch&gscoord=${p.at[0]}%7C${p.at[1]}&gsradius=500&gsnamespace=6&gslimit=50`)).json();
      const titles = (g.query?.geosearch || []).map(x => x.title).filter(t => /\.jpe?g$/i.test(t)).slice(0, 50);
      if (titles.length) {
        const r = await (await fetch(C + `action=query&prop=imageinfo&iiprop=url%7Ctimestamp%7Cextmetadata&iiextmetadatafilter=DateTimeOriginal&iiurlwidth=320&titles=${encodeURIComponent(titles.join('|'))}`)).json();
        const year = ii => +((ii.extmetadata?.DateTimeOriginal?.value || '').match(/(19|20)\d\d/) || [ii.timestamp?.slice(0, 4)])[0] || 0;
        const imgs = Object.values(r.query?.pages || {}).map(pg => pg.imageinfo?.[0]).filter(ii => ii && ii.thumburl)
          .map(ii => ({ src:ii.thumburl, y:year(ii), page:ii.descriptionurl })).filter(i => i.y >= 2018).sort((a, b) => b.y - a.y).slice(0, 4);
        out = { page:`https://commons.wikimedia.org/wiki/Special:Nearby#/coord/${p.at[0]},${p.at[1]}`, imgs };
      }
    }
    PHOTO[p.id] = out;
    try { localStorage.setItem(LS + '-img2', JSON.stringify(PHOTO)); } catch (e) {}
    return out;
  }
  function loadPhotos(p) {
    photosFor(p).then(o => {
      if (current !== p || !o.imgs.length) return;
      const box = $('card').querySelector('.photos'); if (!box) return;
      box.innerHTML = o.imgs.map(i => `<a href="${esc(i.page)}" target="_blank" rel="noopener"><img src="${esc(i.src)}" alt="Photo, ${i.y}" loading="lazy" onerror="this.parentNode.remove()"></a>`).join('');
      $('card').querySelector('.credit').innerHTML = `Recent photos from <a href="${esc(o.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
      const t = $('card').querySelector('.ph'); t.querySelector('.phn').textContent = `${o.imgs.length} recent photo${o.imgs.length > 1 ? 's' : ''}`; t.hidden = false;
      showPhotos(!!state.photosOpen);
    }).catch(() => {});
  }

  function showPhotos(on) {
    const c = $('card'), t = c.querySelector('.ph'); if (!t || t.hidden) return;
    c.querySelector('.photos').hidden = c.querySelector('.credit').hidden = !on;
    t.setAttribute('aria-expanded', String(on)); t.classList.toggle('on', on);
  }

  // ---------- the shelf ----------
  let current = null, shut = phone();
  const REFRESH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>';   // shuffle: pick another
  const HANDLE = '<div class="handle" aria-hidden="true"></div>';
  function renderCard(animate) {
    const c = $('card'), p = current, n = state.places.filter(fits).length;
    c.classList.toggle('idle', !p); c.classList.remove('landed');
    const peek = `<div class="peek"><span class="pn">${p ? esc(p.name) : n ? 'Where to?' : 'Nothing fits'}</span>${p ? `<button class="act round" data-a="pick" aria-label="Another">${REFRESH}</button><button class="act round" data-a="open" aria-label="Show details"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>` : ''}</div>`;
    if (!p) {
      // before the first pick the shelf is just one line: tap the arrow (or pull up) and it chooses
      c.innerHTML = HANDLE + `<div class="peek start"><span class="pn">${n ? 'Where to?' : 'Nothing fits'}</span>
        <button class="act round main" data-a="pick" aria-label="Pick somewhere" ${n ? '' : 'disabled'}>${REFRESH}</button></div>`;
    } else {
      c.innerHTML = HANDLE + peek + `<div class="meta"><span class="tag" style="--c:${ink(p)};--tint:${tint(p)}">${SECTORS[sectorOf(p.kind)][0]}</span><span class="facts">${KINDS[p.kind] !== SECTORS[sectorOf(p.kind)][0] ? KINDS[p.kind] + ' · ' : ''}${WHERE[p.where]} · ${COST[p.cost]} · ${minsLabel(p.mins)}</span></div>
        <h2>${esc(p.name)}</h2>
        <p class="where">${esc([p.area, p.been.length ? 'last went ' + ago(p.been[p.been.length - 1]) : ''].filter(Boolean).join(' · '))}</p>
        <button class="ph" data-a="photos" aria-expanded="false" hidden><span class="phn"></span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5L5 6.5 8 3.5"/></svg></button>
        <div class="photos" hidden></div><p class="credit" hidden></p>
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
        <button class="act round corner" data-a="pick" aria-label="Another">${REFRESH}</button>
        <div class="acts">
          <a class="act main" href="${esc(dirUrl(p))}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.2L20 4l-7.2 16.5-2.1-7.2z"/></svg>Directions</a>
        </div>`;
      loadPhotos(p);
    }
    c.classList.toggle('shut', shut);
    if (animate) { void c.offsetWidth; c.classList.add('landed'); }
  }
  function setShelf(close) {
    shut = close && phone(); $('card').classList.toggle('shut', shut);
    if (!shut) $('card').scrollTop = 0;
  }
  $('card').addEventListener('click', e => {
    if (cardDragged) return;
    const a = e.target.closest('[data-a]');
    if (!a) return;
    if (a.dataset.a === 'open') { setShelf(false); if (current) requestAnimationFrame(() => centreOn(current, true)); return; }
    if (a.dataset.a === 'pick') { if (shut) setShelf(false); pick(); }
    if (a.dataset.a === 'photos') { state.photosOpen = !state.photosOpen; save(); showPhotos(state.photosOpen); }
  });
  // flick the shelf: up opens it (and picks somewhere if nothing's chosen yet), down tucks it away
  let y0 = null, dy = 0, t0 = 0, cardDragged = false;
  $('card').addEventListener('pointerdown', e => {
    if (!phone() || e.button > 0 || e.target.closest('.photos, a, button:not(.handle)')) return;
    if (!shut && $('card').scrollTop > 0 && !e.target.closest('.handle')) return;   // let the open shelf scroll
    y0 = e.clientY; dy = 0; t0 = Date.now(); cardDragged = false;
  });
  addEventListener('pointermove', e => {
    if (y0 === null) return;
    dy = e.clientY - y0;
    if (!cardDragged && Math.abs(dy) < 6) return;
    cardDragged = true; $('card').classList.add('drag');
    $('card').style.transform = `translateY(${shut ? Math.min(0, dy) * .35 : Math.max(0, dy)}px)`;
  });
  addEventListener('pointerup', () => {
    if (y0 === null) return;
    const c = $('card'), v = dy / Math.max(1, Date.now() - t0); y0 = null;
    c.classList.remove('drag'); c.classList.add('snap'); c.style.transform = '';
    setTimeout(() => c.classList.remove('snap'), 340);
    if (cardDragged) {
      if (!shut && (dy > 60 || v > .5)) setShelf(true);
      else if (shut && (dy < -24 || v < -.3)) { setShelf(false); if (!current) pick(); }
    } else if (shut) { setShelf(false); if (!current) pick(); }
    setTimeout(() => { cardDragged = false; }, 0);
  });
  addEventListener('resize', () => { if (!phone() && shut) setShelf(false); });

  function select(p, animate) {
    current = p; if (p && animate) shut = false;
    renderMap(); renderCard(animate);
  }

  // ---------- pick ----------
  function weight(p) {
    let w = p.been.length ? 1 : 2.5;
    if (p.mine) w *= 1.6;
    const i = state.last.indexOf(p.id); if (i > -1) w *= 0.05 + i * 0.12;
    if (p.been.length && (Date.now() - new Date(p.been[p.been.length - 1])) < 7 * 864e5) w *= 0.2;
    return w;
  }
  let busy = false;
  function pick() {
    if (busy) return;
    const c = state.places.filter(fits).filter(p => p !== current);
    if (!c.length) { toast(current ? 'That’s the only one that fits' : 'Nothing fits. Tap an underlined word'); return; }
    let r = Math.random() * c.reduce((s, p) => s + weight(p), 0), win = c[c.length - 1];
    for (const p of c) { r -= weight(p); if (r <= 0) { win = p; break; } }
    state.last = [win.id, ...state.last.filter(x => x !== win.id)].slice(0, 6); save();
    select(win, true); requestAnimationFrame(() => centreOn(win));
  }

  // ---------- edit ----------
  const open = id => { $(id).hidden = false; };
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) { m.hidden = true; commitEdit(); refresh(); } }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('edit').hidden) { $('edit').hidden = true; commitEdit(); refresh(); } });
  function opts(box, map, isOn, onPick) {
    box.innerHTML = Object.entries(map).map(([k, l]) => `<button class="opt ${isOn(k) ? 'on' : ''}" data-k="${k}">${l}</button>`).join('');
    box.onclick = e => { const b = e.target.closest('.opt'); if (b) { onPick(b.dataset.k); save(); } };
  }
  let editing = null;
  function renderEdit() {
    const p = editing, qq = s => document.querySelector(`[data-e="${s}"]`);
    opts(qq('where'), WHERE, k => p.where === k, k => { p.where = k; renderEdit(); });
    opts(qq('cost'), Object.fromEntries(COST.map((c, i) => [i, c])), k => p.cost === +k, k => { p.cost = +k; renderEdit(); });
    opts(qq('mins'), Object.fromEntries(MINS.map(m => [m, minsLabel(m)])), k => p.mins === +k, k => { p.mins = +k; renderEdit(); });
    opts(qq('energy'), ENERGY, k => p.energy === k, k => { p.energy = k; renderEdit(); });
    opts(qq('kind'), KINDS, k => p.kind === k, k => { p.kind = k; renderEdit(); });
    $('eBeenH').textContent = p.been.length ? `Been ${p.been.length}× · last ${ago(p.been[p.been.length - 1])}` : 'Not been yet';
    $('eBeen').textContent = p.been.includes(today()) ? 'Unmark today' : 'Been today';
  }
  function openEdit(p) { editing = p; $('eName').value = p.name; $('eArea').value = p.area || ''; $('eNote').value = p.note || ''; renderEdit(); open('edit'); }
  function commitEdit() {
    if (!editing) return;
    editing.name = $('eName').value.trim() || editing.name; editing.area = $('eArea').value.trim(); editing.note = $('eNote').value.trim();
    delete editing.guessed; save(); editing = null;
  }
  $('eBeen').addEventListener('click', () => {
    const p = editing, d = today();
    p.been = p.been.includes(d) ? p.been.filter(x => x !== d) : [...p.been, d]; save(); renderEdit();
  });
  $('eDel').addEventListener('click', () => {
    const p = editing, i = state.places.indexOf(p); editing = null;
    state.places.splice(i, 1); save(); $('edit').hidden = true;
    if (current === p) current = null;
    refresh(); toast('Removed ' + p.name, () => { state.places.splice(i, 0, p); save(); refresh(); });
  });

  let tt;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg; $('toastUndo').hidden = !undo;
    $('toastUndo').onclick = () => { undo && undo(); $('toast').classList.remove('show'); };
    $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), undo ? 4500 : 2200);
  }

  function refresh() {
    if (current && (!state.places.includes(current) || !fits(current))) current = null;
    renderAsk(); renderMap(); renderCard();
  }
  buildMap(); refresh();
  // tapping the name starts afresh: filters cleared, nothing picked, map back to its first view
  $('home').addEventListener('click', e => { e.preventDefault(); hop(); state.f = blankF(); save(); setTimeout(() => location.reload(), 420); });


  // ---------- today's weather: one symbol, from Open-Meteo (no key needed) ----------
  const WX_ICONS = {
    sun:   '<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/>',
    part:  '<circle cx="18" cy="17" r="6"/><path d="M18 5v3M6 17h3M9.5 8.5l2.1 2.1M26.5 8.5l-2.1 2.1"/><path d="M15 38h20a7 7 0 0 0 .6-14 9 9 0 0 0-17.2 2.4A5.8 5.8 0 0 0 15 38z"/>',
    cloud: '<path d="M12 36h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 36z"/>',
    rain:  '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M16 35l-2 5M24 35l-2 5M32 35l-2 5"/>',
    snow:  '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M16 36v.1M24 39v.1M32 36v.1M20 43v.1M28 43v.1" stroke-width="3.4"/>',
    storm: '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M25 31l-4 7h6l-4 7"/>',
    fog:   '<path d="M10 18h28M6 25h32M12 32h28M8 39h20"/>',
  };
  const wxKind = c => c === 0 ? 'sun' : c <= 2 ? 'part' : c === 3 ? 'cloud' : c <= 48 ? 'fog' : c <= 67 ? 'rain' : c <= 77 ? 'snow' : c <= 82 ? 'rain' : c <= 86 ? 'snow' : 'storm';
  const WX_WORD = { sun:'Sunny', part:'Sunny spells', cloud:'Cloudy', rain:'Rain', snow:'Snow', storm:'Thunder', fog:'Fog' };
  // the forecast decides the weather for the day; the symbol only shows it
  function showWx(w) {
    const k = wxKind(w.code), wet = ['rain', 'snow', 'storm'].includes(k) || w.pop >= 60;
    $('wx').innerHTML = `<span class="deg">${Math.round(w.max)}°</span><svg viewBox="0 0 48 48" aria-hidden="true">${WX_ICONS[k]}</svg>`;
    $('wx').setAttribute('aria-label', `Today in Belfast: ${WX_WORD[k]}, ${Math.round(w.max)}°${w.pop != null ? `, ${w.pop}% chance of rain` : ''}`);
    $('wx').hidden = false;
    state.f.wx = wet ? 'rain' : 'dry'; refresh();
  }
  (async () => {
    try {
      const c = JSON.parse(localStorage.getItem(LS + '-wx') || 'null');
      if (c && c.day === today() && Date.now() - c.at < 3 * 36e5) return showWx(c);
    } catch (e) {}
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=54.597&longitude=-5.930&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FLondon&forecast_days=1');
      const d = (await r.json()).daily;
      const w = { day:today(), at:Date.now(), code:d.weather_code[0], max:d.temperature_2m_max[0], pop:d.precipitation_probability_max[0] };
      try { localStorage.setItem(LS + '-wx', JSON.stringify(w)); } catch (e) {}
      showWx(w);
    } catch (e) { /* no forecast here: no symbol, and weather doesn't filter */ }
  })();
}
</script>
</body>
</html>

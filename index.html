  const HANDLE = '<div class="handle" aria-hidden="true"></div>';
  function renderCard(animate) {
    const c = $('card'), p = current, n = state.places.filter(fits).length;
    c.classList.toggle('idle', !p); c.classList.remove('landed');
    const peek = `<div class="peek"><span class="pn">${p ? esc(p.name) : n ? 'Where to?' : 'Nothing fits'}</span>${p ? `<button class="act round quiet" data-a="pick" aria-label="Another">${REFRESH}</button><button class="act round quiet" data-a="open" aria-label="Show details"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>` : ''}</div>`;
    if (!p) {
      // before the first pick the shelf is just one line: tap the arrow (or pull up) and it chooses
      // before the first pick: no sheet at all, just one round button floating bottom right
      c.innerHTML = `<button class="act round main fab" data-a="pick" aria-label="${n ? 'Where to? Pick somewhere' : 'Nothing fits'}" ${n ? '' : 'disabled'}>${REFRESH}</button>`;
    } else {
      c.innerHTML = HANDLE + peek + `<div class="meta"><span class="tag" style="--c:${ink(p)};--tint:${tint(p)}">${SECTORS[sectorOf(p.kind)][0]}</span><span class="facts">${KINDS[p.kind] !== SECTORS[sectorOf(p.kind)][0] ? KINDS[p.kind] + ' · ' : ''}${WHERE[p.where]} · ${COST[p.cost]} · ${minsLabel(p.mins)}</span></div>
        <h2>${esc(p.name)}</h2>
        <p class="where">${esc([p.area, p.been.length ? 'last went ' + ago(p.been[p.been.length - 1]) : ''].filter(Boolean).join(' · '))}</p>
        <button class="ph" data-a="photos" aria-expanded="false" hidden><span class="phn"></span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5L5 6.5 8 3.5"/></svg></button>
        <div class="photos" hidden></div><p class="credit" hidden></p>
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
        <button class="act round quiet corner" data-a="pick" aria-label="Another">${REFRESH}</button>
        <div class="acts">
          <a class="act main" href="${esc(dirUrl(p))}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.2L20 4l-7.2 16.5-2.1-7.2z"/></svg>Directions</a>
        </div>`;
      loadPhotos(p);
    }
    if (Date.now() < pressedUntil) c.querySelectorAll('[data-a=pick]').forEach(b => b.classList.add('pressed'));
    c.classList.toggle('shut', shut);
    if (animate) { void c.offsetWidth; c.classList.add('landed'); }
  }
  function setShelf(close) {
    shut = close && phone(); $('card').classList.toggle('shut', shut);
    if (!shut) $('card').scrollTop = 0;
  }
  $('card').addEventListener('click', e => {
    if (cardDragged) return;
    const a = e.target.closest('[data-a]');
    if (!a) return;
    if (a.dataset.a === 'open') { setShelf(false); if (current) requestAnimationFrame(() => centreOn(current, true)); return; }
    if (a.dataset.a === 'pick') { pressedUntil = Date.now() + 500; setTimeout(() => document.querySelectorAll('.pressed').forEach(b => b.classList.remove('pressed')), 560); if (shut && !current) setShelf(false); pick(shut && !!current); }
    if (a.dataset.a === 'photos') { state.photosOpen = !state.photosOpen; save(); showPhotos(state.photosOpen); }
  });
  // flick the shelf: up opens it (and picks somewhere if nothing's chosen yet), down tucks it away
  let y0 = null, dy = 0, t0 = 0, cardDragged = false;
  $('card').addEventListener('pointerdown', e => {
    if (!phone() || e.button > 0 || e.target.closest('.photos, a, button:not(.handle)')) return;
    if (!shut && $('card').scrollTop > 0 && !e.target.closest('.handle')) return;   // let the open shelf scroll
    y0 = e.clientY; dy = 0; t0 = Date.now(); cardDragged = false;
  });
  addEventListener('pointermove', e => {
    if (y0 === null) return;
    dy = e.clientY - y0;
    if (!cardDragged && Math.abs(dy) < 6) return;
    cardDragged = true; $('card').classList.add('drag');
    $('card').style.transform = `translateY(${shut ? (dy < 0 ? dy * .35 : current ? dy : 0) : Math.max(0, dy)}px)`;
  });
  addEventListener('pointerup', () => {
    if (y0 === null) return;
    const c = $('card'), v = dy / Math.max(1, Date.now() - t0); y0 = null;
    c.classList.remove('drag'); c.classList.add('snap'); c.style.transform = '';
    setTimeout(() => c.classList.remove('snap'), 340);
    if (cardDragged) {
      if (!shut && (dy > 60 || v > .5)) setShelf(true);                                              // open → tucked bar with the name
      else if (shut && current && (dy > 40 || v > .4)) { current = null; updateSel(); renderCard(); showAll(); }   // tucked → back to the start, zoomed out
      else if (shut && (dy < -24 || v < -.3)) { setShelf(false); if (!current) pick(); }
    } else if (shut) { setShelf(false); if (!current) pick(); }
    setTimeout(() => { cardDragged = false; }, 0);
  });
  addEventListener('resize', () => { if (!phone() && shut) setShelf(false); });

  function select(p, animate, stayShut) {
    current = p; if (p && animate && !stayShut) shut = false;
    map ? updateSel() : renderMap(); renderCard(animate);
  }

  // ---------- pick ----------
  function weight(p) {
    let w = p.been.length ? 1 : 2.5;
    if (p.mine) w *= 1.6;
    const i = state.last.indexOf(p.id); if (i > -1) w *= 0.05 + i * 0.12;
    if (p.been.length && (Date.now() - new Date(p.been[p.been.length - 1])) < 7 * 864e5) w *= 0.2;
    return w;
  }
  let busy = false;
  function pick(stayShut) {
    if (busy) return;
    const c = state.places.filter(fits).filter(p => p !== current);
    if (!c.length) { toast(current ? 'That’s the only one that fits' : 'Nothing fits. Tap an underlined word'); return; }
    let r = Math.random() * c.reduce((s, p) => s + weight(p), 0), win = c[c.length - 1];
    for (const p of c) { r -= weight(p); if (r <= 0) { win = p; break; } }
    state.last = [win.id, ...state.last.filter(x => x !== win.id)].slice(0, 6); save();
    select(win, true, stayShut); requestAnimationFrame(() => centreOn(win));
  }

  // ---------- edit ----------
  const open = id => { $(id).hidden = false; };
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) { m.hidden = true; commitEdit(); refresh(); } }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('edit').hidden) { $('edit').hidden = true; commitEdit(); refresh(); } });
  function opts(box, map, isOn, onPick) {
    box.innerHTML = Object.entries(map).map(([k, l]) => `<button class="opt ${isOn(k) ? 'on' : ''}" data-k="${k}">${l}</button>`).join('');
    box.onclick = e => { const b = e.target.closest('.opt'); if (b) { onPick(b.dataset.k); save(); } };
  }
  let editing = null;
  function renderEdit() {
    const p = editing, qq = s => document.querySelector(`[data-e="${s}"]`);
    opts(qq('where'), WHERE, k => p.where === k, k => { p.where = k; renderEdit(); });
    opts(qq('cost'), Object.fromEntries(COST.map((c, i) => [i, c])), k => p.cost === +k, k => { p.cost = +k; renderEdit(); });
    opts(qq('mins'), Object.fromEntries(MINS.map(m => [m, minsLabel(m)])), k => p.mins === +k, k => { p.mins = +k; renderEdit(); });
    opts(qq('energy'), ENERGY, k => p.energy === k, k => { p.energy = k; renderEdit(); });
    opts(qq('kind'), KINDS, k => p.kind === k, k => { p.kind = k; renderEdit(); });
    $('eBeenH').textContent = p.been.length ? `Been ${p.been.length}× · last ${ago(p.been[p.been.length - 1])}` : 'Not been yet';
    $('eBeen').textContent = p.been.includes(today()) ? 'Unmark today' : 'Been today';
  }
  function openEdit(p) { editing = p; $('eName').value = p.name; $('eArea').value = p.area || ''; $('eNote').value = p.note || ''; renderEdit(); open('edit'); }
  function commitEdit() {
    if (!editing) return;
    editing.name = $('eName').value.trim() || editing.name; editing.area = $('eArea').value.trim(); editing.note = $('eNote').value.trim();
    delete editing.guessed; save(); editing = null;
  }
  $('eBeen').addEventListener('click', () => {
    const p = editing, d = today();
    p.been = p.been.includes(d) ? p.been.filter(x => x !== d) : [...p.been, d]; save(); renderEdit();
  });
  $('eDel').addEventListener('click', () => {
    const p = editing, i = state.places.indexOf(p); editing = null;
    state.places.splice(i, 1); save(); $('edit').hidden = true;
    if (current === p) current = null;
    refresh(); toast('Removed ' + p.name, () => { state.places.splice(i, 0, p); save(); refresh(); });
  });

  let tt;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg; $('toastUndo').hidden = !undo;
    $('toastUndo').onclick = () => { undo && undo(); $('toast').classList.remove('show'); };
    $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), undo ? 4500 : 2200);
  }

  function showAll() {
    if (!map) return;
    const pts = state.places.filter(p => p.at && fits(p)).map(p => p.at);
    if (!pts.length) return;
    waiting(true); map.once('moveend', () => waiting(false));
    map.flyToBounds(pts, { paddingTopLeft:[32, 24 + topH()], paddingBottomRight:[32, 32 + botH()], maxZoom:13, duration:.9, easeLinearity:.2 });
  }
  function refresh() {
    if (current && (!state.places.includes(current) || !fits(current))) current = null;
    renderAsk(); renderMap(); renderCard();
  }
  buildMap(); refresh(); setTop();
  // where you are: a blue dot, like every maps app, once the browser has your permission
  let meMark = null;
  if (navigator.geolocation && window.L && map) navigator.geolocation.watchPosition(pos => {
    const at = [pos.coords.latitude, pos.coords.longitude];
    if (!meMark) meMark = L.marker(at, { icon:L.divIcon({ className:'', iconSize:[16, 16], iconAnchor:[8, 8], html:'<span class="me"></span>' }), interactive:false, keyboard:false, zIndexOffset:2000 }).addTo(map);
    else meMark.setLatLng(at);
  }, () => {}, { enableHighAccuracy:false, maximumAge:120000, timeout:20000 });
  // tapping the name starts afresh: filters cleared, nothing picked, map back to its first view
  $('home').addEventListener('click', e => { e.preventDefault(); hop(); state.f = blankF(); save(); setTimeout(() => location.reload(), 420); });


  // ---------- today's weather: one symbol, from Open-Meteo (no key needed) ----------
  const WX_ICONS = {
    sun:   '<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/>',
    part:  '<circle cx="18" cy="17" r="6"/><path d="M18 5v3M6 17h3M9.5 8.5l2.1 2.1M26.5 8.5l-2.1 2.1"/><path d="M15 38h20a7 7 0 0 0 .6-14 9 9 0 0 0-17.2 2.4A5.8 5.8 0 0 0 15 38z"/>',
    cloud: '<path d="M12 36h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 36z"/>',
    rain:  '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M16 35l-2 5M24 35l-2 5M32 35l-2 5"/>',
    snow:  '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M16 36v.1M24 39v.1M32 36v.1M20 43v.1M28 43v.1" stroke-width="3.4"/>',
    storm: '<path d="M12 29h23a8 8 0 0 0 .7-16 10.5 10.5 0 0 0-20.2 2.7A6.7 6.7 0 0 0 12 29z"/><path d="M25 31l-4 7h6l-4 7"/>',
    fog:   '<path d="M10 18h28M6 25h32M12 32h28M8 39h20"/>',
  };
  const wxKind = c => c === 0 ? 'sun' : c <= 2 ? 'part' : c === 3 ? 'cloud' : c <= 48 ? 'fog' : c <= 67 ? 'rain' : c <= 77 ? 'snow' : c <= 82 ? 'rain' : c <= 86 ? 'snow' : 'storm';
  const WX_WORD = { sun:'Sunny', part:'Sunny spells', cloud:'Cloudy', rain:'Rain', snow:'Snow', storm:'Thunder', fog:'Fog' };
  // the forecast decides the weather for the day; the symbol only shows it
  function showWx(w) {
    const k = wxKind(w.code), wet = ['rain', 'snow', 'storm'].includes(k) || w.pop >= 60;
    $('wx').innerHTML = `<span class="deg">${Math.round(w.max)}°</span><svg viewBox="0 0 48 48" aria-hidden="true">${WX_ICONS[k]}</svg>`;
    $('wx').setAttribute('aria-label', `Today in Belfast: ${WX_WORD[k]}, ${Math.round(w.max)}°${w.pop != null ? `, ${w.pop}% chance of rain` : ''}`);
    $('wx').hidden = false;
    state.f.wx = wet ? 'rain' : 'dry'; refresh();
  }
  (async () => {
    try {
      const c = JSON.parse(localStorage.getItem(LS + '-wx') || 'null');
      if (c && c.day === today() && Date.now() - c.at < 3 * 36e5) return showWx(c);
    } catch (e) {}
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=54.597&longitude=-5.930&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FLondon&forecast_days=1');
      const d = (await r.json()).daily;
      const w = { day:today(), at:Date.now(), code:d.weather_code[0], max:d.temperature_2m_max[0], pop:d.precipitation_probability_max[0] };
      try { localStorage.setItem(LS + '-wx', JSON.stringify(w)); } catch (e) {}
      showWx(w);
    } catch (e) { /* no forecast here: no symbol, and weather doesn't filter */ }
  })();
}
</script>
</body>
</html>
